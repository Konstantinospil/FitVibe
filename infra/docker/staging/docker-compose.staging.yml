services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/fitvibe-backend:latest}
    env_file: .env.staging
    environment:
      PORT: "4000"
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    restart: always
    depends_on:
      clamav:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    ports:
      - "4100:4000"

  clamav:
    image: clamav/clamav:latest
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/fitvibe-frontend:latest}
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "4173:4173"

  db:
    image: postgres:18-alpine
    security_opt:
      - no-new-privileges:true
    user: "999:999" # postgres user
    environment:
      POSTGRES_USER: fitvibe
      POSTGRES_PASSWORD: fitvibe
      POSTGRES_DB: fitvibe
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
