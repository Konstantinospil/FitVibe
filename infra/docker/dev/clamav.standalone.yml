services:
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - CLAMD_STARTUP_TIMEOUT=120
      - FRESHCLAM_CHECKS=0
    healthcheck:
      test: ["CMD-SHELL", "reply=\"$(printf 'PING\\n' | nc -w 3 127.0.0.1 3310)\" && test \"$reply\" = \"PONG\""]
      interval: 10s
      timeout: 2s
      retries: 12
