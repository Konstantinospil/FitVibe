events {}

http {
  upstream fitvibe_backend {
    server backend:4000;
    keepalive 16;
  }

  upstream fitvibe_frontend {
    server frontend:4173;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /__ingress_health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://fitvibe_backend;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://fitvibe_frontend;
    }
  }
}
