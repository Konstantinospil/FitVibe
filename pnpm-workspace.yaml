packages:
  - "apps/*"
  - "packages/*"
  - "infra"
  - "tests"

# pnpm 12 build-script policy. Keep this explicit so CI fails closed for any
# newly introduced dependency that tries to run lifecycle scripts.
allowBuilds:
  pnpm: true
  protobufjs: true
  snyk: true
  esbuild: true
  # Jest 30.5 uses Parcel's native watcher in jest-haste-map.
  '@parcel/watcher': true
  # Jest 30.5 uses the native-backed resolver via jest-resolve.
  unrs-resolver: true
  msgpackr-extract: false

# pnpm 12 reads dependency-resolution policy from pnpm-workspace.yaml.
