name: Stage consolidated Dependabot lockfile
on:
  push:
    branches:
      - fix/dependabot-consolidated-majors
    paths:
      - .github/workflows/stage-consolidated-deps.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependabot-consolidated-majors
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Commit generated lockfile
        run: |
          git diff --check
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): regenerate consolidated Dependabot lockfile'
          git push origin HEAD:fix/dependabot-consolidated-majors
