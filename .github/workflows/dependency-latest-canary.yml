name: Latest Dependency Compatibility Canary

# Advisory, isolated test of latest releases. Never deploy or publish images.
on:
  schedule:
    - cron: "20 6 * * 2"
  workflow_dispatch:
    inputs:
      remove_override:
        description: "Optional single override to remove in this disposable runner"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fitvibe-latest-dependencies
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      HUSKY: "0"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout development baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Validate canary safeguards
        run: node --test tests/qa/dependency-canary.test.mjs
      - name: Install baseline
        run: |
          mkdir -p dependency-canary-report
          pnpm install --frozen-lockfile --no-offline
          git rev-parse HEAD > dependency-canary-report/base-commit.txt
          node -e 'const fs=require("fs");const m=require("./package.json");fs.writeFileSync("dependency-canary-report/toolchain.json",JSON.stringify({packageManager:m.packageManager,pnpm:m.devDependencies.pnpm},null,2))'
      - name: Remove one override in disposable checkout
        if: github.event_name == 'workflow_dispatch' && inputs.remove_override != ''
        env:
          OVERRIDE_NAME: \${{ inputs.remove_override }}
        run: node scripts/dependencies/probe-override.mjs "$OVERRIDE_NAME" > dependency-canary-report/override-probe.json
      - name: Resolve dependency graph for selected canary mode
        id: upgrade
        continue-on-error: true
        env:
          OVERRIDE_NAME: ${{ inputs.remove_override }}
        run: |
          if [ -n "$OVERRIDE_NAME" ]; then
            echo "Single override removal probe; NOT upgrading other dependencies" > dependency-canary-report/upgrade.log
            pnpm install --lockfile-only > dependency-canary-report/lockfile-refresh.log 2>&1
          else
            pnpm -r --include-workspace-root update --latest > dependency-canary-report/upgrade.log 2>&1
            node scripts/dependencies/restore-toolchain.mjs dependency-canary-report/toolchain.json
            pnpm install --lockfile-only > dependency-canary-report/lockfile-refresh.log 2>&1
          fi
      - name: Restore toolchain on failed upgrade
        if: steps.upgrade.outcome == 'failure'
        run: node scripts/dependencies/restore-toolchain.mjs dependency-canary-report/toolchain.json
      - name: Report dependency changes
        if: always()
        run: |
          git diff -- package.json ':(glob)**/package.json' pnpm-lock.yaml pnpm-workspace.yaml > dependency-canary-report/changes.patch
          git status --short > dependency-canary-report/status.txt
      - name: Dependency and vulnerability checks
        if: steps.upgrade.outcome == 'success'
        id: security
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile --no-offline
          pnpm audit --prod --audit-level=low 2>&1 | tee dependency-canary-report/security.log
          node tests/qa/check-resolved-dependencies.cjs
          if [ -z "$OVERRIDE_NAME" ]; then
            node tests/qa/check-dependency-overrides.cjs
          fi
        env:
          OVERRIDE_NAME: \${{ inputs.remove_override }}
      - name: Static and build compatibility
        if: steps.security.outcome == 'success'
        id: static
        continue-on-error: true
        run: |
          pnpm lint:check 2>&1 | tee dependency-canary-report/lint.log
          pnpm typecheck 2>&1 | tee dependency-canary-report/typecheck.log
          pnpm build 2>&1 | tee dependency-canary-report/build.log
      - name: Frontend unit tests
        if: steps.static.outcome == 'success'
        id: frontend
        continue-on-error: true
        run: pnpm --filter @fitvibe/frontend exec vitest run 2>&1 | tee dependency-canary-report/frontend-unit.log
      - name: Backend unit tests
        if: steps.static.outcome == 'success'
        id: backend
        continue-on-error: true
        run: pnpm --filter @fitvibe/backend exec jest --runInBand --testPathIgnorePatterns='integration|migrations/migrations\.test\.ts|seeds/seeds\.test\.ts' 2>&1 | tee dependency-canary-report/backend-unit.log
      - name: Summarize
        if: always()
        env:
          UPGRADE: \${{ steps.upgrade.outcome }}
          SECURITY: \${{ steps.security.outcome }}
          STATIC: \${{ steps.static.outcome }}
          FRONTEND: \${{ steps.frontend.outcome }}
          BACKEND: \${{ steps.backend.outcome }}
          OVERRIDE_NAME: \${{ inputs.remove_override }}
        run: |
          {
            echo "# Latest dependency canary"
            echo "Baseline: feature"
            echo "Mode: $([ -n "$OVERRIDE_NAME" ] && echo single-override-probe || echo all-latest-update)"
            echo "Upgrade: $UPGRADE"
            echo "Security: $SECURITY"
            echo "Static/build: $STATIC"
            echo "Frontend unit: $FRONTEND"
            echo "Backend unit: $BACKEND"
            echo "Single override probe: $OVERRIDE_NAME"
            echo
            echo "This is a nondeploying compatibility probe, not the full PR CI."
            echo "Integration/E2E, production Docker smoke and ARM64 checks must still pass in the standard PR pipeline."
          } | tee dependency-canary-report/summary.md
          cat dependency-canary-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-canary-\${{ github.run_id }}
          path: dependency-canary-report/
          retention-days: 90
      - name: Mark incompatibilities as failed
        if: always()
        env:
          UPGRADE: \${{ steps.upgrade.outcome }}
          SECURITY: \${{ steps.security.outcome }}
          STATIC: \${{ steps.static.outcome }}
          FRONTEND: \${{ steps.frontend.outcome }}
          BACKEND: \${{ steps.backend.outcome }}
        run: |
          for result in "$UPGRADE" "$SECURITY" "$STATIC" "$FRONTEND" "$BACKEND"; do
            if [ "$result" != success ]; then
              echo "::error::Latest-version compatibility failed; inspect report artifact."
              exit 1
            fi
          done
