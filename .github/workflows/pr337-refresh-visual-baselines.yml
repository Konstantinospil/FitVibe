name: PR337 Refresh Visual Baselines

on:
  push:
    branches:
      - ci/307-architecture-hardcoding-gate
    paths:
      - ".github/workflows/pr337-refresh-visual-baselines.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate PR337 Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/307-architecture-hardcoding-gate
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Regenerate Linux baselines
        run: pnpm test:visual:update

      - name: Verify regenerated baselines
        run: pnpm test:visual

      - name: Restrict generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git status --porcelain               | awk '{print $2}'               | grep -vE '^tests/frontend/visual/.+\.spec\.ts-snapshots/.+-linux\.png$'               || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit regenerated baselines
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/frontend/visual; then
            echo "No baseline changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/frontend/visual/**/*-linux.png'
          git commit -m "test(visual): refresh PR337 Linux baselines"
          git push origin HEAD:ci/307-architecture-hardcoding-gate
