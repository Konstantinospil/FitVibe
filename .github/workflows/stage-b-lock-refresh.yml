name: Stage B Lockfile Regeneration (temporary)
on:
  push:
    branches:
      - fix/557-deterministic-onboarding-fixtures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile from reviewed security overrides
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Validate lockfile changes
        run: |
          node tests/qa/check-dependency-overrides.cjs
          git diff --exit-code -- package.json
          grep -q "follow-redirects@1.16.2" pnpm-lock.yaml
          grep -q "glob@14.0.2" pnpm-lock.yaml
          grep -q "minimatch@11.0.1" pnpm-lock.yaml
      - name: Validate patched production dependencies
        run: pnpm audit --prod --audit-level=low
      - name: Commit lockfile to fix branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(security): regenerate pnpm lockfile with patched dependencies"
            git push origin "HEAD:refs/heads/fix/557-deterministic-onboarding-fixtures"
          fi
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-regenerated-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
