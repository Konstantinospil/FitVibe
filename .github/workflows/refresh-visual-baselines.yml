# Manually refresh reviewed visual baselines. Do not auto-update expected images.
name: Refresh Visual Linux Baselines

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source branch containing reviewed UI
        required: true
        type: string
      refresh_scope:
        description: Reviewed snapshot group
        required: true
        type: choice
        default: reset-password
        options:
          - reset-password
          - approved-pages

concurrency:
  group: visual-baseline-refresh-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Visual Linux Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --ipc=host

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 0

      - name: Trust workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build visual frontend
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Refresh changed Linux baselines against live preview
        working-directory: apps/frontend
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173
          DISABLE_WEBSERVER: "true"
          CI: "true"
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client >/tmp/fitvibe-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/fitvibe-preview.log
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          if [ "$REFRESH_SCOPE" = "reset-password" ]; then
            # Run only the 8 light/dark viewport combinations for Reset Password.
            # Seven approved images should change; dark/sm must stay unchanged.
            pnpm exec playwright test tests/frontend/visual/pages/auth.spec.ts \
              --grep "Auth Page Visual Tests reset password" \
              --config tests/frontend/visual/config/playwright.config.ts \
              --update-snapshots=changed
          elif [ "$REFRESH_SCOPE" = "approved-pages" ]; then
            pnpm exec playwright test tests/frontend/visual/pages/home.spec.ts \
              tests/frontend/visual/pages/auth.spec.ts \
              tests/frontend/visual/pages/legal.spec.ts \
              tests/frontend/visual/components/navbar.spec.ts \
              --config tests/frontend/visual/config/playwright.config.ts \
              --update-snapshots=changed
          else
            echo "::error::Unsupported refresh scope: $REFRESH_SCOPE"
            exit 1
          fi

      - name: Commit refreshed Linux baselines via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const branch = process.env.SOURCE_REF;
          const scope = process.env.REFRESH_SCOPE;
          const api = "https://api.github.com";
          const snapshotDir = "tests/frontend/visual/pages/auth.spec.ts-snapshots";
          // #557: reviewed against VRT artifact from CI run 40243884456.
          const approved = new Map([
            ["reset-password-ui-dark-lg-linux.png", "741ee8f87e846236b45798d387e7d49dd13591abff30bb080c0ce8410b34279c"],
            ["reset-password-ui-dark-md-linux.png", "23c1564c2ca36f46ba28fa53ae6b8a954bb9f93bb295cabfd97bf69271a109c7"],
            ["reset-password-ui-dark-xs-linux.png", "ca782dae2fc82bfd987d02e4dfcdf7aac7b534baf2cfa55e9b51ef93a22d67fa"],
            ["reset-password-ui-light-lg-linux.png", "ef70103bebd67bf3e1e943e77a9e05f3dbd3b4528417ae089afa1bedf167e604"],
            ["reset-password-ui-light-md-linux.png", "1f8b98d0d27dabae20ff0295694dbf0d975672156f84b5fd327a6fda1ed4d93f"],
            ["reset-password-ui-light-sm-linux.png", "d9f02a9dce44d7be3b5eba244a4a1fffee83ea4132fa4ef0c06b6ef15ba2a489"],
            ["reset-password-ui-light-xs-linux.png", "8ea4e2419034e753a3a5de9136b7ffbb93e94e881ef56e3e3b4c53ddcb0a44bb"],
          ].map(([name, hash]) => [`${snapshotDir}/${name}`, hash]));
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          };

          const status = execFileSync(
            "git",
            ["status", "--porcelain", "--untracked-files=all", "--", "tests/frontend/visual"],
            { encoding: "utf8" },
          );

          const changedPaths = [...new Set(
            status.split("\n").filter(Boolean).map((line) => line.slice(3).trim()),
          )];
          const approvedGeneral = (path) =>
            /^tests\/frontend\/visual\/(?:pages\/(?:home|auth|legal)|components\/navbar)\.spec\.ts-snapshots\/[^/]+-linux\.png$/.test(path);
          const permitted = (path) => scope === "reset-password"
            ? approved.has(path)
            : scope === "approved-pages" && approvedGeneral(path);
          const unexpected = changedPaths.filter((path) => !permitted(path));
          if (unexpected.length) {
            throw new Error(`Refusing unexpected changes: ${unexpected.join(", ")}`);
          }
          const files = changedPaths.filter(permitted);
          if (scope === "reset-password") {
            if (files.length !== approved.size) {
              throw new Error(`Expected 7 reviewed screenshots, found ${files.length}: ${files.join(", ")}`);
            }
            for (const path of files) {
              const actualHash = createHash("sha256").update(await readFile(path)).digest("hex");
              if (actualHash !== approved.get(path)) {
                throw new Error(`Regenerated image differs from approved CI capture: ${path}`);
              }
            }
          } else if (scope !== "approved-pages") {
            throw new Error(`Unsupported scope: ${scope}`);
          }

          if (files.length === 0) {
            console.log("No approved Linux visual baseline changes produced.");
            process.exit(0);
          }

          console.log("Baseline files to commit:");
          for (const file of files) console.log(`- ${file}`);

          const request = async (path, options = {}) => {
            const response = await fetch(`${api}/repos/${repo}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            if (!response.ok) {
              throw new Error(`${options.method || "GET"} ${path}: ${response.status} ${await response.text()}`);
            }
            return response.json();
          };

          const ref = await request(`/git/ref/heads/${branch}`);
          const headSha = ref.object.sha;
          const testedSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (headSha !== testedSha) {
            throw new Error(
              `Source branch moved from tested commit ${testedSha} to ${headSha}; refusing to commit stale visual baselines.`,
            );
          }
          const headCommit = await request(`/git/commits/${headSha}`);
          const treeEntries = [];

          for (const path of files) {
            const content = (await readFile(path)).toString("base64");
            const blob = await request("/git/blobs", {
              method: "POST",
              body: JSON.stringify({ content, encoding: "base64" }),
            });
            treeEntries.push({ path, mode: "100644", type: "blob", sha: blob.sha });
          }

          const tree = await request("/git/trees", {
            method: "POST",
            body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: treeEntries }),
          });

          const commit = await request("/git/commits", {
            method: "POST",
            body: JSON.stringify({
              message: `test(visual): refresh reviewed ${scope} Linux baselines (#557)`,
              tree: tree.sha,
              parents: [headSha],
            }),
          });

          await request(`/git/refs/heads/${branch}`, {
            method: "PATCH",
            body: JSON.stringify({ sha: commit.sha, force: false }),
          });

          console.log(`Committed ${files.length} refreshed Linux baseline(s) in ${commit.sha}`);
          NODE

      - name: Upload refreshed visual artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-visual-baselines-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tests/frontend/visual/__screenshots__
            playwright-report/visual
            test-results/visual-junit.xml
