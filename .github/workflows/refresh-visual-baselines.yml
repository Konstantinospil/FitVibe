# Manually regenerate Linux screenshots and open a reviewable draft PR.
name: Refresh Visual Linux Baselines

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Feature or fix/* branch containing reviewed UI
        required: true
        default: feature
        type: string
      refresh_scope:
        description: Active visual screenshot group
        required: true
        type: choice
        default: all
        options:
          - all
          - auth
          - legal
          - home
          - navbar

concurrency:
  group: visual-baseline-refresh-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    name: Generate and verify Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --ipc=host
    steps:
      - name: Validate source branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_REF" =~ ^(feature|fix/[a-z0-9][a-z0-9._-]*)$ ]]; then
            echo "::error::Branch is not allowed by the FitVibe branch policy"
            exit 1
          fi

      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Test baseline ownership contract
        run: node --test tests/qa/visual-baseline-workflow.test.mjs

      - name: Build visual frontend
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Generate selected screenshots and verify complete visual suite
        working-directory: apps/frontend
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173
          DISABLE_WEBSERVER: "true"
          CI: "true"
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client >/tmp/fitvibe-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/fitvibe-preview.log
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          case "$REFRESH_SCOPE" in
            all) ;;
            auth) set -- tests/frontend/visual/pages/auth.spec.ts ;;
            legal) set -- tests/frontend/visual/pages/legal.spec.ts ;;
            home) set -- tests/frontend/visual/pages/home.spec.ts ;;
            navbar) set -- tests/frontend/visual/components/navbar.spec.ts ;;
            *) echo "::error::Unknown scope"; exit 1 ;;
          esac
          pnpm exec playwright test "$@" \
            --config tests/frontend/visual/config/playwright.config.ts \
            --update-snapshots=changed
          # Re-run every active visual/structural test against the regenerated images.
          pnpm test:visual:ci
          # Fail before publishing any unexpected filesystem changes.
          node tests/frontend/visual/scripts/validate-baseline-changes.mjs "$REFRESH_SCOPE"

      - name: Publish reviewed snapshots as draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REFRESH_SCOPE: ${{ inputs.refresh_scope }}
        run: node tests/frontend/visual/scripts/publish-baseline-pr.mjs

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-visual-baselines-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            tests/frontend/visual/__screenshots__/
            playwright-report/visual/
            test-results/visual-junit.xml
