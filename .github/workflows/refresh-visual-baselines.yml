# Manual refresh regenerates only the Home Linux baselines for the explicit MFA/footer state matrix.
# The complete VRT suite runs separately in CI without baseline updates.
# Manual trigger after the visual suite's non-snapshot contracts are green.
# Refresh merged fix-branch Home screenshot baselines on 2026-10-12.
name: Refresh Visual Linux Baselines

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch containing the UI changes to capture
        required: true
        default: feature
        type: string
  push:
    branches: ["fix/vrt-home-state-matrix"]
    paths:
      - ".github/workflows/refresh-visual-baselines.yml"
      - "tests/frontend/visual/pages/home.spec.ts"
      - "tests/frontend/visual/helpers/capture.ts"
      - "apps/frontend/src/components/FirstLoginTwoFactorPrompt.tsx"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Visual Linux Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --ipc=host

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 0

      - name: Trust workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build visual frontend
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Refresh changed Linux baselines against live preview
        working-directory: apps/frontend
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173
          DISABLE_WEBSERVER: "true"
          CI: "true"
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client >/tmp/fitvibe-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/fitvibe-preview.log
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          pnpm exec playwright test tests/frontend/visual/pages/home.spec.ts \
            --config tests/frontend/visual/config/playwright.config.ts \
            --update-snapshots=changed \
            --workers=1 \
            --timeout=90000

      - name: Commit refreshed Linux baselines via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";

          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const branch = process.env.SOURCE_REF;
          const api = "https://api.github.com";
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          };

          const status = execFileSync(
            "git",
            ["status", "--porcelain", "--untracked-files=all", "--", "tests/frontend/visual"],
            { encoding: "utf8" },
          );

          const files = [...new Set(
            status
              .split("\n")
              .filter(Boolean)
              .map((line) => line.slice(3).trim())
              .filter((path) => path.includes("-snapshots/") && path.endsWith("-linux.png")),
          )];

          if (files.length === 0) {
            console.log("No Linux visual baseline changes produced.");
            process.exit(0);
          }

          console.log("Baseline files to commit:");
          for (const file of files) console.log(`- ${file}`);

          const request = async (path, options = {}) => {
            const response = await fetch(`${api}/repos/${repo}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            if (!response.ok) {
              throw new Error(`${options.method || "GET"} ${path}: ${response.status} ${await response.text()}`);
            }
            return response.json();
          };

          const ref = await request(`/git/ref/heads/${branch}`);
          const headSha = ref.object.sha;
          const testedSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (headSha !== testedSha) {
            throw new Error(
              `Source branch moved from tested commit ${testedSha} to ${headSha}; refusing to commit stale visual baselines.`,
            );
          }
          const headCommit = await request(`/git/commits/${headSha}`);
          const treeEntries = [];

          for (const path of files) {
            const content = (await readFile(path)).toString("base64");
            const blob = await request("/git/blobs", {
              method: "POST",
              body: JSON.stringify({ content, encoding: "base64" }),
            });
            treeEntries.push({ path, mode: "100644", type: "blob", sha: blob.sha });
          }

          const tree = await request("/git/trees", {
            method: "POST",
            body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: treeEntries }),
          });

          const commit = await request("/git/commits", {
            method: "POST",
            body: JSON.stringify({
              message: "test(visual): refresh Linux baselines for current feature UI",
              tree: tree.sha,
              parents: [headSha],
            }),
          });

          await request(`/git/refs/heads/${branch}`, {
            method: "PATCH",
            body: JSON.stringify({ sha: commit.sha, force: false }),
          });

          console.log(`Committed ${files.length} refreshed Linux baseline(s) in ${commit.sha}`);
          NODE

      - name: Upload refreshed visual artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-visual-baselines-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tests/frontend/visual/__screenshots__
            playwright-report/visual
            test-results/visual-junit.xml
