name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Optional successful main CI run ID; leave empty to deploy the latest successful main CI run"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  PROD_SOURCE_DIR: ${{ vars.PROD_SOURCE_DIR || '/srv/containers/FitVibe_demo' }}
  PROD_STACK_DIR: ${{ vars.PROD_STACK_DIR || '/srv/stacks/fitvibe' }}

jobs:
  resolve_ci:
    name: Resolve successful main CI run
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == github.repository
      )
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve CI run
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requested = '${{ inputs.ci_run_id }}'.trim();

            let run;

            if (context.eventName === 'workflow_run') {
              run = context.payload.workflow_run;
            } else if (requested) {
              if (!/^\d+$/.test(requested)) {
                core.setFailed('ci_run_id must be a numeric GitHub Actions run ID.');
                return;
              }

              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(requested),
              });
              run = response.data;
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                event: 'push',
                status: 'success',
                per_page: 1,
              });
              run = response.data.workflow_runs[0];
            }

            if (!run) {
              core.setFailed('No successful CI run on main was found.');
              return;
            }

            const runRepository = run.repository?.full_name;
            if (runRepository && runRepository !== context.payload.repository.full_name) {
              core.setFailed(`Refusing CI run from another repository: ${runRepository}`);
              return;
            }

            if (run.name !== 'CI' && !String(run.path || '').endsWith('/ci.yml')) {
              core.setFailed(`Run ${run.id} is not the CI workflow.`);
              return;
            }

            if (run.head_branch !== 'main') {
              core.setFailed(`Run ${run.id} belongs to branch "${run.head_branch}", not main.`);
              return;
            }

            if (run.event !== 'push') {
              core.setFailed(`Run ${run.id} was triggered by "${run.event}", not a push.`);
              return;
            }

            if (run.conclusion !== 'success') {
              core.setFailed(`Run ${run.id} did not complete successfully.`);
              return;
            }

            core.setOutput('run_id', String(run.id));
            core.setOutput('head_sha', run.head_sha);

  deploy:
    name: Deploy successful main build
    runs-on: ubuntu-latest
    needs: [resolve_ci]
    environment:
      name: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download container artifacts from CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-artifacts-${{ needs.resolve_ci.outputs.run_id }}
          path: artifacts
          run-id: ${{ needs.resolve_ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment artifacts
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          digest_file="artifacts/image-digests.txt"
          if [[ ! -f "${digest_file}" ]]; then
            echo "Missing ${digest_file} in CI artifacts." >&2
            exit 1
          fi

          backend="$(sed -n 's/^backend=//p' "${digest_file}" | head -n 1)"
          frontend="$(sed -n 's/^frontend=//p' "${digest_file}" | head -n 1)"
          stack_version="$(sed -n 's/^stack_version=//p' "${digest_file}" | head -n 1)"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          case "${backend}" in
            "${REGISTRY}/${owner}/fitvibe-backend@sha256:"*) ;;
            *)
              echo "Unexpected backend image reference: ${backend}" >&2
              exit 1
              ;;
          esac

          case "${frontend}" in
            "${REGISTRY}/${owner}/fitvibe-frontend@sha256:"*) ;;
            *)
              echo "Unexpected frontend image reference: ${frontend}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${stack_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected stack version: ${stack_version}" >&2
            exit 1
          fi

          echo "backend_image=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "stack_version=${stack_version}" >> "${GITHUB_OUTPUT}"
          echo "deploy_sha=${{ needs.resolve_ci.outputs.head_sha }}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify backend signature
        run: >
          cosign verify
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          ${{ steps.deployment.outputs.backend_image }}

      - name: Verify frontend signature
        run: >
          cosign verify
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          ${{ steps.deployment.outputs.frontend_image }}

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PROD_HOST }}

      - name: Deploy to production host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,STACK_VERSION,DEPLOY_SHA,PROD_SOURCE_DIR,PROD_STACK_DIR
          script: |
            set -eu

            : "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
            : "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
            : "${STACK_VERSION:?STACK_VERSION is required}"
            : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
            : "${PROD_SOURCE_DIR:?PROD_SOURCE_DIR is required}"
            : "${PROD_STACK_DIR:?PROD_STACK_DIR is required}"

            if [ ! -d "${PROD_SOURCE_DIR}/.git" ]; then
              echo "Production source repository not found at ${PROD_SOURCE_DIR}" >&2
              exit 1
            fi

            if [ ! -f "${PROD_STACK_DIR}/.env" ]; then
              echo "Production environment file not found at ${PROD_STACK_DIR}/.env" >&2
              exit 1
            fi

            cd "${PROD_SOURCE_DIR}"
            git fetch --prune origin main

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "Deployment commit ${DEPLOY_SHA} is not available after fetching main." >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main; then
              echo "Deployment commit ${DEPLOY_SHA} is not part of origin/main." >&2
              exit 1
            fi

            git checkout -B main "${DEPLOY_SHA}"

            canonical_compose="${PROD_SOURCE_DIR}/infra/docker/prod/compose.yml"
            if [ ! -f "${canonical_compose}" ]; then
              echo "Canonical production compose file not found at ${canonical_compose}" >&2
              exit 1
            fi
            install -m 0644 "${canonical_compose}" "${PROD_STACK_DIR}/compose.yml"

            cd "${PROD_STACK_DIR}"
            export BACKEND_IMAGE FRONTEND_IMAGE STACK_VERSION

            compose() {
              docker compose --env-file .env -f compose.yml "$@"
            }

            compose config --quiet

            resolved_images="$(compose config --images)"
            while IFS= read -r image; do
              if ! printf '%s\n' "${image}" | grep -Eq '@sha256:[0-9a-fA-F]{64}$'; then
                echo "Production compose resolved a mutable image reference: ${image}" >&2
                echo "All production images must be pinned by a full sha256 digest." >&2
                exit 1
              fi
            done <<EOF_IMAGES
            ${resolved_images}
            EOF_IMAGES

            if ! printf '%s\n' "${resolved_images}" | grep -Fx "${BACKEND_IMAGE}" >/dev/null; then
              echo "compose.yml does not resolve backend to ${BACKEND_IMAGE}." >&2
              echo "The production stack must consume the BACKEND_IMAGE variable from CD." >&2
              exit 1
            fi
            if ! printf '%s\n' "${resolved_images}" | grep -Fx "${FRONTEND_IMAGE}" >/dev/null; then
              echo "compose.yml does not resolve frontend to ${FRONTEND_IMAGE}." >&2
              echo "The production stack must consume the FRONTEND_IMAGE variable from CD." >&2
              exit 1
            fi

            compose pull
            compose up -d --remove-orphans

            compose exec -T backend node dist/db/utils/migrateAll.js
            compose exec -T backend node dist/db/utils/seedAll.js
            compose exec -T backend node dist/db/utils/postDeploy.js
            compose exec -T backend node dist/db/utils/verifyIntegrity.js

            attempt=1
            until curl -fsS http://127.0.0.1:4000/health >/dev/null; do
              if [ "${attempt}" -ge 24 ]; then
                echo "Backend health check failed after 120 seconds." >&2
                compose ps
                compose logs --tail=200 backend frontend
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done

            curl -fsS http://127.0.0.1:4000/metrics >/dev/null
            curl -fsS http://127.0.0.1/ >/dev/null
            compose ps
        env:
          BACKEND_IMAGE: ${{ steps.deployment.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.deployment.outputs.frontend_image }}
          STACK_VERSION: ${{ steps.deployment.outputs.stack_version }}
          DEPLOY_SHA: ${{ steps.deployment.outputs.deploy_sha }}
          PROD_SOURCE_DIR: ${{ env.PROD_SOURCE_DIR }}
          PROD_STACK_DIR: ${{ env.PROD_STACK_DIR }}
