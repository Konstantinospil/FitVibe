name: Format frontend repair

on:
  push:
    branches: ["feat/341-frontend-restructure"]

permissions:
  contents: write

concurrency:
  group: format-frontend-repair
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/341-frontend-restructure
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Format repaired frontend files
        run: >
          pnpm exec prettier --write
          apps/frontend/src/components/composites/HomeFeedCard.tsx
          apps/frontend/src/components/composites/TrainingSurface.tsx
          apps/frontend/src/components/composites/WorkoutEditor.tsx
          apps/frontend/src/pages/Home.tsx
          apps/frontend/src/pages/Calendar.tsx
          apps/frontend/src/config/trainingSurfaces.ts
          tests/frontend/pages/Home.test.tsx
          tests/frontend/pages/Calendar.test.tsx
          tests/frontend/components/WorkoutEditor.test.tsx
          tests/frontend/layouts/MainLayout.test.tsx
          tests/frontend/routes/ProtectedRoutes.test.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/frontend/src/components/composites/HomeFeedCard.tsx             apps/frontend/src/components/composites/TrainingSurface.tsx             apps/frontend/src/components/composites/WorkoutEditor.tsx             apps/frontend/src/pages/Home.tsx             apps/frontend/src/pages/Calendar.tsx             apps/frontend/src/config/trainingSurfaces.ts             tests/frontend/pages/Home.test.tsx             tests/frontend/pages/Calendar.test.tsx             tests/frontend/components/WorkoutEditor.test.tsx             tests/frontend/layouts/MainLayout.test.tsx             tests/frontend/routes/ProtectedRoutes.test.tsx
          git commit -m "style(frontend): format repaired training surfaces"
          git push origin HEAD:feat/341-frontend-restructure
