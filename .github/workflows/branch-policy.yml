name: Audit Branch Policy

on:
  create:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: branch-policy
  cancel-in-progress: false

jobs:
  enforce:
    name: Report branches outside policy
    runs-on: ubuntu-latest
    steps:
      - name: Audit unauthorized branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allowed = new Set(["main", "dev", "feature"]);
            const isAllowed = (name) => allowed.has(name) || /^fix\/[a-z0-9][a-z0-9._-]*$/.test(name);
            const { owner, repo } = context.repo;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );

            const unauthorized = branches
              .map((branch) => branch.name)
              .filter((name) => !isAllowed(name));

            if (unauthorized.length === 0) {
              core.info("Branch policy satisfied: permanent branches and fix/* only.");
              return;
            }

            for (const branch of unauthorized) {
              core.warning(`Branch requires review (no deletion): ${branch}`);
            }
            await core.summary
              .addHeading("Branch policy audit")
              .addRaw(`Found ${unauthorized.length} branch(es) outside the naming policy. No branches were deleted.`)
              .write();
