name: Dependency Lock Refresh

on:
  pull_request:
    paths:
      - "package.json"
      - "apps/backend/package.json"
      - ".github/workflows/dependency-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Regenerate lockfile from manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify vulnerable braces path is removed
        run: |
          if grep -q "braces@3.0.3" pnpm-lock.yaml; then
            echo "::error::braces@3.0.3 remains in the regenerated dependency graph"
            pnpm why braces -r || true
            exit 1
          fi
          echo "braces@3.0.3 is absent from the regenerated lockfile"

      - name: Show updated dependency paths
        run: |
          pnpm why micromatch -r || true
          pnpm why braces -r || true

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-lock-refresh-${{ github.run_id }}
          path: pnpm-lock.yaml
          retention-days: 7
          if-no-files-found: error
