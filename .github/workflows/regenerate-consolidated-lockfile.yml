name: Regenerate consolidated dependency lockfile

on:
  push:
    branches:
      - chore/dependabot-consolidated

permissions:
  contents: write

jobs:
  lockfile:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --no-offline

      - name: Commit authoritative lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/regenerate-consolidated-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): regenerate pnpm 12 lockfile on current dev"
          git push
