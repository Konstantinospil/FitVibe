  zap_baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 25
    needs:
      - quality
      - frontend_tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build production SSR frontend
        run: pnpm --filter @fitvibe/frontend run build:ssr

      - name: Scan compiled client for secrets
        run: node tests/security/secret-scan.cjs apps/frontend/dist/client

      - name: Start production SSR frontend
        run: |
          NODE_ENV=production PORT=4173 pnpm --filter @fitvibe/frontend run start:ssr > /tmp/fitvibe-zap-ssr.log 2>&1 &
          echo $! > /tmp/fitvibe-zap-ssr.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then
              echo "Production SSR frontend ready for ZAP"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitvibe-zap-ssr.log || true
          echo "Production SSR frontend did not become ready for ZAP" >&2
          exit 1

      - name: Verify SSR security headers
        run: |
          headers="$(curl -fsSI http://127.0.0.1:4173/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp'
          printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          if printf '%s\n' "$headers" | grep -qi '^x-powered-by:'; then
            echo "::error::SSR leaks X-Powered-By"
            exit 1
          fi
          csp="$(printf '%s\n' "$headers" | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy:[[:space:]]*//p')"
          printf '%s\n' "$csp" | grep -q "script-src 'self'"
          if printf '%s\n' "$csp" | grep -Eq "script-src[^;]*'unsafe-inline'"; then
            echo "::error::SSR CSP permits inline scripts"
            exit 1
          fi
          if printf '%s\n' "$csp" | grep -Eq "style-src[^-][^;]*'unsafe-inline'"; then
            echo "::error::SSR CSP broadly permits inline style blocks"
            exit 1
          fi

      - name: Verify ZAP container can reach SSR
        run: |
          docker run --rm --network=host --entrypoint /bin/sh ghcr.io/zaproxy/zaproxy:stable -c '
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:4173/health >/dev/null; then exit 0; fi
              sleep 2
            done
            echo "ZAP container cannot reach the SSR target" >&2
            exit 1
          '

      - name: Run ZAP baseline scan
        timeout-minutes: 12
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:4173
          rules_file_name: .zap/rules.tsv
          cmd_options: -c .zap/rules.tsv -j --client-spider
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ github.run_id }}

      - name: Stop frontend
        if: always()
        run: |
          if [ -f /tmp/fitvibe-zap-ssr.pid ]; then
            kill "$(cat /tmp/fitvibe-zap-ssr.pid)" 2>/dev/null || true
          fi

  performance:
    name: Performance Budgets (real backend)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 25
    needs:
      - quality
      - database_tests
      - lighthouse
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_perf
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_perf
      NODE_ENV: development
      PORT: "4000"
      CSRF_ENABLED: "false"
      METRICS_ENABLED: "true"
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1,::ffff:127.0.0.1"
      REDIS_ENABLED: "false"
      CLAMAV_ENABLED: "false"
      EMAIL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PostgreSQL client prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Wait for PostgreSQL
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Migrate and seed performance database
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/migrateAll.ts
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/seedAll.ts

      - name: Build backend
        run: pnpm --filter @fitvibe/backend run build

      - name: Start real backend
        timeout-minutes: 5
        run: |
          pnpm --filter @fitvibe/backend start > /tmp/fitvibe-perf-backend.log 2>&1 &
          echo $! > /tmp/fitvibe-perf-backend.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:4000/api/v1/system/read-only/status >/dev/null
              curl -fsS http://127.0.0.1:4000/api/v1/exercise-types >/dev/null
              curl -fsS http://127.0.0.1:4000/api/v1/translations/en >/dev/null
              echo "Real FitVibe backend is ready for k6"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitvibe-perf-backend.log || true
          echo "Backend did not become ready for performance testing" >&2
          exit 1

      - name: Run k6 real-stack smoke load
        timeout-minutes: 10
        env:
          API_BASE_URL: http://127.0.0.1:4000
        run: k6 run --summary-export=tests/perf/k6-summary.json tests/perf/k6-smoke.js

      - name: Assert k6 performance budgets
        timeout-minutes: 5
        run: node tests/perf/assert-budgets.cjs tests/perf/k6-summary.json

      - name: Stop backend
        if: always()
        timeout-minutes: 1
        run: |
          if [ -f /tmp/fitvibe-perf-backend.pid ]; then
            kill "$(cat /tmp/fitvibe-perf-backend.pid)" 2>/dev/null || true
          fi

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-metrics-${{ github.run_id }}
          path: |
            tests/perf/k6-summary.json
            /tmp/fitvibe-perf-backend.log
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          echo "## Performance Budgets Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ k6 exercised the built FitVibe backend with a migrated/seeded PostgreSQL database." >> "$GITHUB_STEP_SUMMARY"
            echo "- CI smoke load is a regression gate, not a production-capacity certification." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ Real-stack performance smoke test failed." >> "$GITHUB_STEP_SUMMARY"
          fi

  pre_main_amd64_smoke:
    name: Pre-main amd64 Production Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        env:
          FRESHCLAM_CHECKS: 0
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Generate smoke-test JWT key pair
        run: |
          mkdir -p "$RUNNER_TEMP/fitvibe-jwt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/fitvibe-jwt/private.pem"
          openssl pkey -in "$RUNNER_TEMP/fitvibe-jwt/private.pem" -pubout \
            -out "$RUNNER_TEMP/fitvibe-jwt/public.pem"
          chmod 644 "$RUNNER_TEMP/fitvibe-jwt/private.pem" "$RUNNER_TEMP/fitvibe-jwt/public.pem"

      - name: Migrate smoke-test database
        timeout-minutes: 5
        env:
          NODE_ENV: test
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fitvibe_test
          PGUSER: postgres
        run: pnpm --filter @fitvibe/backend run db:migrate

      - name: Build amd64 production images locally
        timeout-minutes: 20
        run: |
          docker build -f infra/docker/prod/Dockerfile.backend -t fitvibe-backend:pre-main .
          docker build -f infra/docker/prod/Dockerfile.frontend -t fitvibe-frontend:pre-main .
          docker build -f infra/docker/prod/Dockerfile.backoffice -t fitvibe-backoffice:pre-main .

      - name: Start backend production container
        run: |
          docker run -d \
            --name pre-main-backend \
            --add-host=host.docker.internal:host-gateway \
            -p 4100:4000 \
            -v "$RUNNER_TEMP/fitvibe-jwt/private.pem:/run/secrets/jwt-private.pem:ro" \
            -v "$RUNNER_TEMP/fitvibe-jwt/public.pem:/run/secrets/jwt-public.pem:ro" \
            -e DATABASE_URL="postgresql://postgres@host.docker.internal:5432/fitvibe_test" \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-private.pem \
            -e JWT_PUBLIC_KEY_PATH=/run/secrets/jwt-public.pem \
            -e CLAMAV_ENABLED=true \
            -e CLAMAV_HOST=host.docker.internal \
            -e CLAMAV_PORT=3310 \
            -e REDIS_ENABLED=true \
            -e REDIS_HOST=host.docker.internal \
            -e REDIS_PORT=6379 \
            fitvibe-backend:pre-main

      - name: Verify backend production startup
        timeout-minutes: 5
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4100/health >/dev/null; then
              exit 0
            fi
            if [ "$i" -eq 60 ]; then
              docker logs pre-main-backend
              exit 1
            fi
            sleep 2
          done

      - name: Start frontend production container
        run: |
          docker run -d \
            --name pre-main-frontend \
            -p 8080:4173 \
            -e NODE_ENV=production \
            -e PORT=4173 \
            fitvibe-frontend:pre-main

      - name: Verify frontend production startup and SSR
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs pre-main-frontend
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!doctype html\|<html'

      - name: Start backoffice production container
        run: |
          docker network create pre-main-fitvibe
          docker network connect --alias backend pre-main-fitvibe pre-main-backend
          docker run -d             --name pre-main-backoffice             --network pre-main-fitvibe             -p 8081:8080             fitvibe-backoffice:pre-main
          docker exec pre-main-backoffice nginx -T 2>&1 | grep -F 'location = /__backoffice_health'

      - name: Verify backoffice production startup
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/__backoffice_health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs pre-main-backoffice
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/login | grep -qi '<!doctype html\|<html'
          curl -fsS http://127.0.0.1:8081/health | grep -qi 'status\|ok'
          # Verify the published-image contract: this endpoint must be served locally by Nginx.
          docker exec pre-main-backoffice sh -c 'grep -F "return 200" /etc/nginx/conf.d/default.conf'

      - name: Cleanup production smoke containers
        if: always()
        run: |
          docker rm -f pre-main-backend pre-main-frontend pre-main-backoffice 2>/dev/null || true
          docker network rm pre-main-fitvibe 2>/dev/null || true


  pre_main_arm64_build:
    name: Pre-main arm64 Production Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build arm64 backend production image
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.backend
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false

      - name: Build arm64 frontend production image
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.frontend
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false

      - name: Build arm64 backoffice production image
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.backoffice
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false

  qa_summary:
    name: QA Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - architecture_hardcoding
      - quality
      - deployment_contract
      - backend_tests
      - frontend_tests
      - backoffice_tests
      - database_tests
      - coverage
      - integration
      - metrics_contract
      - accessibility
      - security
      - codeql_compatibility
      - zap_baseline
      - openapi_spec
      - lighthouse
      - i18n
      - performance
      - contract_tests
      - visual_regression
      - e2e
      - pre_main_amd64_smoke
      - pre_main_arm64_build
    if: always() && ((github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-${{ github.run_id }}
          path: coverage

      - name: Download performance metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-metrics-${{ github.run_id }}
          path: .

      - name: Download lighthouse report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: tests/perf/lhci-output

      - name: Generate QA summary
        timeout-minutes: 5
        run: node tests/qa/generate-summary.mjs

      - name: Upload QA summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-summary-${{ github.run_id }}
          path: tests/qa/summary
          retention-days: 90
          if-no-files-found: error

      - name: Enforce required QA job results
        if: always()
        run: |
          failed=0
          while IFS='=' read -r job result; do
            [ -z "$job" ] && continue
            printf '%s: %s\n' "$job" "$result"
            if [ "$result" != "success" ]; then
              echo "::error::Required QA job $job concluded with $result"
              failed=1
            fi
          done <<'EOF_RESULTS'
          architecture_hardcoding=${{ needs.architecture_hardcoding.result }}
          quality=${{ needs.quality.result }}
          deployment_contract=${{ needs.deployment_contract.result }}
          backend_tests=${{ needs.backend_tests.result }}
          frontend_tests=${{ needs.frontend_tests.result }}
          backoffice_tests=${{ needs.backoffice_tests.result }}
          database_tests=${{ needs.database_tests.result }}
          coverage=${{ needs.coverage.result }}
          integration=${{ needs.integration.result }}
          metrics_contract=${{ needs.metrics_contract.result }}
          accessibility=${{ needs.accessibility.result }}
          security=${{ needs.security.result }}
          codeql_compatibility=${{ needs.codeql_compatibility.result }}
          zap_baseline=${{ needs.zap_baseline.result }}
          openapi_spec=${{ needs.openapi_spec.result }}
          lighthouse=${{ needs.lighthouse.result }}
          i18n=${{ needs.i18n.result }}
          performance=${{ needs.performance.result }}
          contract_tests=${{ needs.contract_tests.result }}
          visual_regression=${{ needs.visual_regression.result }}
          e2e=${{ needs.e2e.result }}
          pre_main_amd64_smoke=${{ needs.pre_main_amd64_smoke.result }}
          pre_main_arm64_build=${{ needs.pre_main_arm64_build.result }}
          EOF_RESULTS
          exit "$failed"

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 20
    needs:
      - quality
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_accessibility
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres@postgres:5432/fitvibe_accessibility
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_accessibility
      NODE_ENV: development
      PORT: "4000"
      FRONTEND_URL: http://127.0.0.1:4173
      APP_BASE_URL: http://127.0.0.1:4173
      ALLOWED_ORIGINS: http://127.0.0.1:4173
      CSRF_ALLOWED_ORIGINS: http://127.0.0.1:4173
      CSRF_ENABLED: "true"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1,::ffff:127.0.0.1"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CLAMAV_ENABLED: "false"
      EMAIL_ENABLED: "false"
    # Pin the browser runtime and OS dependencies to the same Playwright version
    # as @playwright/test. Do not provision browsers/apt packages at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Migrate and seed accessibility database
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/migrateAll.ts
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/seedAll.ts

      - name: Build backend and production SSR frontend
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend run build
          pnpm --filter @fitvibe/frontend run build:ssr

      - name: Start real backend
        timeout-minutes: 5
        run: |
          pnpm --filter @fitvibe/backend start > /tmp/fitvibe-a11y-backend.log 2>&1 &
          echo $! > /tmp/fitvibe-a11y-backend.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "Real FitVibe backend is ready for accessibility testing"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitvibe-a11y-backend.log || true
          exit 1

      - name: Run axe accessibility suite
        timeout-minutes: 10
        run: >-
          pnpm exec playwright test
          tests/frontend/e2e/accessibility.spec.cjs
          --config tests/frontend/e2e/playwright.config.cjs
          --workers=1

      - name: Stop accessibility backend
        if: always()
        timeout-minutes: 1
        run: |
          if [ -f /tmp/fitvibe-a11y-backend.pid ]; then
            kill "$(cat /tmp/fitvibe-a11y-backend.pid)" 2>/dev/null || true
          fi

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-a11y-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  visual_regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 30
    needs:
      - quality
      - frontend_tests
    permissions:
      contents: read
    # Same Playwright Linux image used by `pnpm test:visual:linux` so font
    # rasterization matches the committed *-linux.png baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build frontend
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Start preview server
        timeout-minutes: 10
        working-directory: apps/frontend
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "Missing dist/client/index.html after build:visual" >&2
            ls -la dist dist/client 2>/dev/null || true
            exit 1
          fi
          # `pnpm --filter … exec` keeps the workspace root as cwd, so Vite would
          # preview an empty repo-root dist/client (HTTP 404) while still printing Local.
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client &
          echo $! > "${GITHUB_WORKSPACE}/preview-server.pid"
          python3 - <<'PY'
          import http.client
          import sys
          import time

          last = "no attempt"
          for _ in range(60):
              try:
                  conn = http.client.HTTPConnection("127.0.0.1", 4173, timeout=2)
                  conn.request("GET", "/")
                  response = conn.getresponse()
                  status = response.status
                  response.read()
                  conn.close()
                  if 200 <= status < 400:
                      print(f"Preview server started (HTTP {status})")
                      sys.exit(0)
                  last = f"HTTP {status}"
              except Exception as exc:
                  last = str(exc)
              time.sleep(2)
          print(f"Preview server did not start in time ({last})", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run visual regression tests
        timeout-minutes: 20
        env:
          APP_URL: "http://127.0.0.1:4173"
          CI: "true"
          DISABLE_WEBSERVER: "true"
        # CI is comparison-only: committed baselines are never rewritten.
        run: pnpm test:visual:ci

      - name: Verify visual baselines were not modified
        if: always()
        run: |
          baseline_changes="$(git status --porcelain --untracked-files=all -- tests/frontend/visual | grep -- '-snapshots/' || true)"
          if [ -n "$baseline_changes" ]; then
            echo "::error::Visual regression CI modified or created baseline snapshots."
            echo "$baseline_changes"
            echo "Baseline updates must be performed explicitly with: pnpm test:visual:update"
            exit 1
          fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) 2>/dev/null || true
            rm -f preview-server.pid
          fi

      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            # Playwright stores actual/expected/diff screenshots and traces here.
            tests/frontend/visual/__screenshots__
            playwright-report/visual
            test-results/visual-junit.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Visual Regression Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Visual regression tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ All screenshots match baseline (maxDiffPixelRatio ≤ 0.2%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Visual regression tests failed" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Visual differences detected - review screenshots" >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: E2E Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 30
    needs: integration
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_e2e
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_e2e
      NODE_ENV: development
      PORT: "4000"
      FRONTEND_URL: http://127.0.0.1:4180
      APP_BASE_URL: http://127.0.0.1:4180
      ALLOWED_ORIGINS: http://127.0.0.1:4180
      CSRF_ALLOWED_ORIGINS: http://127.0.0.1:4180
      CSRF_ENABLED: "true"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1,::ffff:127.0.0.1"
      REDIS_ENABLED: "true"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CLAMAV_ENABLED: "false"
      EMAIL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native E2E prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client \
            nginx

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps

      - name: Migrate and seed E2E database
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/migrateAll.ts
          pnpm --filter @fitvibe/backend exec tsx src/db/utils/seedAll.ts

      - name: Build backend
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/backend run build

      # This is the exact Dockerfile used by pre-main smoke and deployment.
      - name: Build production frontend image for browser E2E
        timeout-minutes: 15
        run: docker build -f infra/docker/prod/Dockerfile.frontend -t fitvibe-frontend:e2e .

      - name: Start real backend
        timeout-minutes: 5
        run: |
          pnpm --filter @fitvibe/backend start > /tmp/fitvibe-e2e-backend.log 2>&1 &
          echo $! > /tmp/fitvibe-e2e-backend.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "Real FitVibe backend is ready for browser E2E"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitvibe-e2e-backend.log || true
          exit 1

      - name: Start isolated production frontend container
        timeout-minutes: 3
        run: |
          docker run -d --name fitvibe-e2e-frontend \
            --publish 127.0.0.1:4173:4173 \
            --env NODE_ENV=production \
            --env PORT=4173 \
            fitvibe-frontend:e2e
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then
              echo "Production frontend container is ready"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' fitvibe-e2e-frontend | grep -qx true; then
              docker logs fitvibe-e2e-frontend
              exit 1
            fi
            sleep 2
          done
          docker logs fitvibe-e2e-frontend
          exit 1

      - name: Start production-contract ingress
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("infra/docker/prod/nginx.conf").read_text()
          source = source.replace("events {}", "pid /tmp/fitvibe-e2e-nginx.pid;\nerror_log /tmp/fitvibe-e2e-nginx-error.log;\n\nevents {}")
          source = source.replace("server backend:4000;", "server 127.0.0.1:4000;")
          source = source.replace("server frontend:4173;", "server 127.0.0.1:4173;")
          source = source.replace("listen 80;", "listen 4180;")
          Path("/tmp/fitvibe-e2e-nginx.conf").write_text(source)
          PY
          sudo nginx -t -c /tmp/fitvibe-e2e-nginx.conf
          sudo nginx -c /tmp/fitvibe-e2e-nginx.conf
          curl -fsS http://127.0.0.1:4180/__ingress_health
          curl -fsS http://127.0.0.1:4180/api/v1/csrf-token | grep -q 'csrfToken'

      - name: Verify production frontend actually renders behind ingress
        timeout-minutes: 2
        run: |
          node - <<'NODE'
          (async () => {
            for (const route of ["/login", "/register", "/"]) {
              const response = await fetch("http://127.0.0.1:4180" + route);
              const html = await response.text();
              if (!response.ok || !html.includes("<html") || !html.includes('id="root"')) {
                throw new Error("Production SSR preflight failed for " + route +
                  " (HTTP " + response.status + "); response: " + html.slice(0, 300));
              }
              console.log("Production SSR preflight OK:", route, response.status);
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
        # Keep the renderer's error log visible if the preflight fails.

      - name: Verify mutation observer regression tests
        run: node --test tests/frontend/e2e/request-observer.test.cjs

      - name: Run authoritative Playwright e2e suite
        timeout-minutes: 20
        env:
          PLAYWRIGHT_EXTERNAL_FRONTEND: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4180
        run: |
          specs="$(find tests/frontend/e2e -maxdepth 1 -name '*.spec.cjs' ! -name 'accessibility.spec.cjs' -print | sort)"
          if [ -z "$specs" ]; then
            echo "::error::No E2E specs discovered"
            exit 1
          fi
          echo "$specs"
          # Accessibility has its own hard gate; every other E2E spec is discovered automatically.
          pnpm exec playwright test $specs --config tests/frontend/e2e/playwright.config.cjs --workers=1 --shard=${{ matrix.shard }}/2

      - name: Stop E2E runtime
        if: always()
        timeout-minutes: 2
        run: |
          docker logs fitvibe-e2e-frontend 2>/dev/null || true
          docker rm -f fitvibe-e2e-frontend 2>/dev/null || true
          if [ -f /tmp/fitvibe-e2e-backend.pid ]; then
            kill "$(cat /tmp/fitvibe-e2e-backend.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/fitvibe-e2e-nginx.conf ]; then
            sudo nginx -c /tmp/fitvibe-e2e-nginx.conf -s stop 2>/dev/null || true
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  # Native amd64/arm64 builds. QEMU emulation of `pnpm fetch` on GitHub's
  # x86_64 runners routinely exceeds the image-build timeout.
  build-platform:
    name: Build images (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs:
      - deployment_contract
      - release_governance
      - qa_summary
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deployment_contract.result == 'success' &&
      needs.release_governance.result == 'success' &&
      needs.qa_summary.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          platform_pair="${{ matrix.platform }}"
          platform_pair="${platform_pair//\//-}"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "INGRESS_IMAGE=ghcr.io/${owner}/fitvibe-ingress" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"
          echo "BACKOFFICE_IMAGE=ghcr.io/${owner}/fitvibe-backoffice" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform_pair}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingress image by digest
        id: ingress
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.ingress
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.INGRESS_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ingress-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ingress-${{ env.PLATFORM_PAIR }}

      - name: Build and push backend image by digest
        id: backend
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.BACKEND_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=backend-${{ env.PLATFORM_PAIR }}

      - name: Build and push frontend image by digest
        id: frontend
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.frontend
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.FRONTEND_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=frontend-${{ env.PLATFORM_PAIR }}

      - name: Build and push backoffice image by digest
        id: backoffice
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.backoffice
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.BACKOFFICE_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backoffice-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=backoffice-${{ env.PLATFORM_PAIR }}

      - name: Export digests
        run: |
          mkdir -p "${RUNNER_TEMP}/ingress-digests" "${RUNNER_TEMP}/backend-digests" "${RUNNER_TEMP}/frontend-digests" "${RUNNER_TEMP}/backoffice-digests"
          ingress_digest="${{ steps.ingress.outputs.digest }}"
          backend_digest="${{ steps.backend.outputs.digest }}"
          frontend_digest="${{ steps.frontend.outputs.digest }}"
          backoffice_digest="${{ steps.backoffice.outputs.digest }}"
          touch "${RUNNER_TEMP}/ingress-digests/${ingress_digest#sha256:}"
          touch "${RUNNER_TEMP}/backend-digests/${backend_digest#sha256:}"
          touch "${RUNNER_TEMP}/frontend-digests/${frontend_digest#sha256:}"
          touch "${RUNNER_TEMP}/backoffice-digests/${backoffice_digest#sha256:}"

      - name: Upload ingress digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ingress-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/ingress-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload backend digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/backend-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload frontend digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/frontend-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload backoffice digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backoffice-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/backoffice-digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-platform
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-platform.result == 'success'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "INGRESS_IMAGE=ghcr.io/${owner}/fitvibe-ingress" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"
          echo "BACKOFFICE_IMAGE=ghcr.io/${owner}/fitvibe-backoffice" >> "$GITHUB_ENV"

      - name: Determine package versions
        id: versions
        timeout-minutes: 2
        run: |
          if [ ! -f apps/backend/package.json ] || [ ! -f apps/frontend/package.json ] || [ ! -f apps/backoffice/package.json ]; then
            echo "Error: package.json files not found" >&2
            exit 1
          fi
          backend=$(node -p "require('./apps/backend/package.json').version")
          frontend=$(node -p "require('./apps/frontend/package.json').version")
          backoffice=$(node -p "require('./apps/backoffice/package.json').version")
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "backoffice=${backoffice}" >> "$GITHUB_OUTPUT"

      - name: Determine release eligibility
        id: release_guard
        timeout-minutes: 2
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Semantic version tags are only published from main."
            exit 0
          fi

          tag="v${{ steps.versions.outputs.backend }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release tag ${tag} already exists; keeping it immutable."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${tag} does not exist; this build may publish it."
          fi

      - name: Download ingress digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/ingress-digests
          pattern: ingress-digests-*
          merge-multiple: true

      - name: Download backend digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/backend-digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Download frontend digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/frontend-digests
          pattern: frontend-digests-*
          merge-multiple: true

      - name: Download backoffice digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/backoffice-digests
          pattern: backoffice-digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        id: manifests
        timeout-minutes: 5
        run: |
          set -euo pipefail

          ingress_count=$(find "${RUNNER_TEMP}/ingress-digests" -type f | wc -l)
          backend_count=$(find "${RUNNER_TEMP}/backend-digests" -type f | wc -l)
          frontend_count=$(find "${RUNNER_TEMP}/frontend-digests" -type f | wc -l)
          backoffice_count=$(find "${RUNNER_TEMP}/backoffice-digests" -type f | wc -l)
          if [ "${ingress_count}" -lt 2 ] || [ "${backend_count}" -lt 2 ] || [ "${frontend_count}" -lt 2 ] || [ "${backoffice_count}" -lt 2 ]; then
            echo "Expected 2 platform digests per image (amd64 + arm64)." >&2
            echo "ingress=${ingress_count} backend=${backend_count} frontend=${frontend_count} backoffice=${backoffice_count}" >&2
            exit 1
          fi

          ingress_refs=""
          for digest_file in "${RUNNER_TEMP}/ingress-digests"/*; do
            ingress_refs="${ingress_refs} ${INGRESS_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          backend_refs=""
          for digest_file in "${RUNNER_TEMP}/backend-digests"/*; do
            backend_refs="${backend_refs} ${BACKEND_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          frontend_refs=""
          for digest_file in "${RUNNER_TEMP}/frontend-digests"/*; do
            frontend_refs="${frontend_refs} ${FRONTEND_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          backoffice_refs=""
          for digest_file in "${RUNNER_TEMP}/backoffice-digests"/*; do
            backoffice_refs="${backoffice_refs} ${BACKOFFICE_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          ingress_tags=(-t "${INGRESS_IMAGE}:sha-${GITHUB_SHA}")
          backend_tags=(-t "${BACKEND_IMAGE}:sha-${GITHUB_SHA}")
          frontend_tags=(-t "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}")
          backoffice_tags=(-t "${BACKOFFICE_IMAGE}:sha-${GITHUB_SHA}")

          if [ "${{ steps.release_guard.outputs.should_release }}" = "true" ]; then
            ingress_tags+=(-t "${INGRESS_IMAGE}:v${{ steps.versions.outputs.backend }}")
            backend_tags+=(-t "${BACKEND_IMAGE}:v${{ steps.versions.outputs.backend }}")
            frontend_tags+=(-t "${FRONTEND_IMAGE}:v${{ steps.versions.outputs.frontend }}")
            backoffice_tags+=(-t "${BACKOFFICE_IMAGE}:v${{ steps.versions.outputs.backoffice }}")
          fi

          docker buildx imagetools create \
            "${ingress_tags[@]}" \
            ${ingress_refs}

          docker buildx imagetools create \
            "${backend_tags[@]}" \
            ${backend_refs}

          docker buildx imagetools create \
            "${frontend_tags[@]}" \
            ${frontend_refs}

          docker buildx imagetools create \
            "${backoffice_tags[@]}" \
            ${backoffice_refs}

          ingress_digest=$(docker buildx imagetools inspect "${INGRESS_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')
          backend_digest=$(docker buildx imagetools inspect "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')
          frontend_digest=$(docker buildx imagetools inspect "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')
          backoffice_digest=$(docker buildx imagetools inspect "${BACKOFFICE_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')

          if [ -z "${ingress_digest}" ] || [ -z "${backend_digest}" ] || [ -z "${frontend_digest}" ] || [ -z "${backoffice_digest}" ]; then
            echo "Failed to resolve merged image digests" >&2
            exit 1
          fi

          echo "ingress_digest=${ingress_digest}" >> "$GITHUB_OUTPUT"
          echo "backend_digest=${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${frontend_digest}" >> "$GITHUB_OUTPUT"
          echo "backoffice_digest=${backoffice_digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign ingress image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.INGRESS_IMAGE }}@${{ steps.manifests.outputs.ingress_digest }}

      - name: Sign backend image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}

      - name: Sign frontend image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}

      - name: Sign backoffice image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.BACKOFFICE_IMAGE }}@${{ steps.manifests.outputs.backoffice_digest }}

      - name: Generate ingress SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.INGRESS_IMAGE }}@${{ steps.manifests.outputs.ingress_digest }}
          output-file: sbom-ingress.spdx.json

      - name: Generate backend SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}
          output-file: sbom-backend.spdx.json

      - name: Generate frontend SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}
          output-file: sbom-frontend.spdx.json

      - name: Generate backoffice SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.BACKOFFICE_IMAGE }}@${{ steps.manifests.outputs.backoffice_digest }}
          output-file: sbom-backoffice.spdx.json

      - name: Resolve infrastructure image digests
        id: infra_images
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          resolve_multiarch_digest() {
            image="$1"
            inspect="$(docker buildx imagetools inspect "$image")"

            printf '%s\n' "$inspect" | grep -q 'Platform:.*linux/amd64' || {
              echo "$image does not provide linux/amd64; refusing to publish it for production." >&2
              exit 1
            }

            printf '%s\n' "$inspect" | grep -Eq 'Platform:.*linux/arm64(/v8)?' || {
              echo "$image does not provide linux/arm64; refusing to publish it for production." >&2
              exit 1
            }

            digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *)
                echo "Invalid immutable digest for $image: $digest" >&2
                exit 1
                ;;
            esac

            printf '%s\n' "$digest"
          }

          postgres_digest="$(resolve_multiarch_digest postgres:16)"
          clamav_digest="$(resolve_multiarch_digest clamav/clamav:1.4.6-debian13-slim)"
          redis_digest="$(resolve_multiarch_digest redis:7-alpine)"

          echo "postgres_image=postgres@$postgres_digest" >> "$GITHUB_OUTPUT"
          echo "clamav_image=clamav/clamav@$clamav_digest" >> "$GITHUB_OUTPUT"
          echo "redis_image=redis@$redis_digest" >> "$GITHUB_OUTPUT"

      - name: Record image digests
        timeout-minutes: 2
        run: |
          printf "ingress=%s@%s\nbackend=%s@%s\nfrontend=%s@%s\nbackoffice=%s@%s\npostgres=%s\nclamav=%s\nredis=%s\nstack_version=v%s\n" \
            "${{ env.INGRESS_IMAGE }}" "${{ steps.manifests.outputs.ingress_digest }}" \
            "${{ env.BACKEND_IMAGE }}" "${{ steps.manifests.outputs.backend_digest }}" \
            "${{ env.FRONTEND_IMAGE }}" "${{ steps.manifests.outputs.frontend_digest }}" \
            "${{ env.BACKOFFICE_IMAGE }}" "${{ steps.manifests.outputs.backoffice_digest }}" \
            "${{ steps.infra_images.outputs.postgres_image }}" \
            "${{ steps.infra_images.outputs.clamav_image }}" \
            "${{ steps.infra_images.outputs.redis_image }}" \
            "${{ steps.versions.outputs.backend }}" > image-digests.txt

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-${{ github.run_id }}
          path: artifacts/openapi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-artifacts-${{ github.run_id }}
          path: |
            sbom-ingress.spdx.json
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
            sbom-backoffice.spdx.json
            image-digests.txt
            artifacts/openapi/openapi.json
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' && steps.release_guard.outputs.should_release == 'true'
        id: create_release
        timeout-minutes: 5
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ steps.versions.outputs.backend }}
          commit: ${{ github.sha }}
          name: Release v${{ steps.versions.outputs.backend }}
          body: |
            - Ingress image: ${{ env.INGRESS_IMAGE }}:v${{ steps.versions.outputs.backend }}
            - Backend image: ${{ env.BACKEND_IMAGE }}:v${{ steps.versions.outputs.backend }}
            - Frontend image: ${{ env.FRONTEND_IMAGE }}:v${{ steps.versions.outputs.frontend }}
            - Backoffice image: ${{ env.BACKOFFICE_IMAGE }}:v${{ steps.versions.outputs.backoffice }}
          draft: false
          prerelease: false
          artifacts: "sbom-backend.spdx.json,sbom-frontend.spdx.json,sbom-backoffice.spdx.json,image-digests.txt,artifacts/openapi/openapi.json"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend image: \`${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend image: \`${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backoffice image: \`${{ env.BACKOFFICE_IMAGE }}@${{ steps.manifests.outputs.backoffice_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Images signed with cosign" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOMs generated" >> $GITHUB_STEP_SUMMARY

  build_verification:
    name: Build Verification (Container Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        env:
          FRESHCLAM_CHECKS: 0
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate smoke-test JWT key pair
        run: |
          mkdir -p "$RUNNER_TEMP/fitvibe-jwt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048             -out "$RUNNER_TEMP/fitvibe-jwt/private.pem"
          openssl pkey -in "$RUNNER_TEMP/fitvibe-jwt/private.pem" -pubout             -out "$RUNNER_TEMP/fitvibe-jwt/public.pem"
          chmod 644 "$RUNNER_TEMP/fitvibe-jwt/private.pem"
          chmod 644 "$RUNNER_TEMP/fitvibe-jwt/public.pem"

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"
          echo "BACKOFFICE_IMAGE=ghcr.io/${owner}/fitvibe-backoffice" >> "$GITHUB_ENV"

      - name: Install postgresql-client
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        timeout-minutes: 5
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Migrate smoke-test database
        timeout-minutes: 2
        env:
          NODE_ENV: test
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fitvibe_test
          PGUSER: postgres
        run: pnpm --filter @fitvibe/backend run db:migrate

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        timeout-minutes: 5
        run: docker pull ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: Report backend image size
        timeout-minutes: 2
        run: |
          BACKEND_TAG="${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}"
          SIZE=$(docker images "$BACKEND_TAG" --format "{{.Size}}" | head -1)
          echo "Backend image size: $SIZE"
          # Extract numeric size (e.g., "1.2GB" -> 1.2)
          NUM_SIZE=$(echo "$SIZE" | sed 's/[^0-9.]//g' | head -c 4)
          if [ -z "$NUM_SIZE" ] || [ "$NUM_SIZE" = "0" ]; then
            echo "Warning: Could not parse image size"
          else
            echo "Backend image size: ${NUM_SIZE} (parsed)"
          fi

      - name: Start backend container
        timeout-minutes: 5
        run: |
          docker run -d \
            --name test-backend \
            --add-host=host.docker.internal:host-gateway \
            -p 4100:4000 \
            -v "$RUNNER_TEMP/fitvibe-jwt/private.pem:/run/secrets/jwt-private.pem:ro" \
            -v "$RUNNER_TEMP/fitvibe-jwt/public.pem:/run/secrets/jwt-public.pem:ro" \
            -e DATABASE_URL="postgresql://postgres@host.docker.internal:5432/fitvibe_test" \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-private.pem \
            -e JWT_PUBLIC_KEY_PATH=/run/secrets/jwt-public.pem \
            -e CLAMAV_ENABLED=true \
            -e CLAMAV_HOST=host.docker.internal \
            -e CLAMAV_PORT=3310 \
            -e REDIS_ENABLED=true \
            -e REDIS_HOST=host.docker.internal \
            -e REDIS_PORT=6379 \
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          echo "Backend container started"

      - name: Wait for backend health check
        timeout-minutes: 30
        run: |
          echo "Waiting for backend health endpoint..."
          for i in {1..60}; do
            if curl -f http://127.0.0.1:4100/health >/dev/null 2>&1; then
              echo "Backend health check passed"
              exit 0
            fi
            if [ $i -eq 60 ]; then
              echo "Backend health check failed after 60 attempts" >&2
              docker logs test-backend
              exit 1
            fi
            sleep 2
          done

      - name: Verify backend health endpoint
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:4100/health)
          echo "Health endpoint response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "ok\|healthy\|status"; then
            echo "✅ Backend health endpoint working"
          else
            echo "❌ Backend health endpoint returned unexpected response"
            exit 1
          fi

      - name: Pull frontend image
        timeout-minutes: 5
        run: docker pull ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

      - name: Report frontend image size
        timeout-minutes: 2
        run: |
          FRONTEND_TAG="${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}"
          SIZE=$(docker images "$FRONTEND_TAG" --format "{{.Size}}" | head -1)
          echo "Frontend image size: $SIZE"
          NUM_SIZE=$(echo "$SIZE" | sed 's/[^0-9.]//g' | head -c 4)
          if [ -z "$NUM_SIZE" ] || [ "$NUM_SIZE" = "0" ]; then
            echo "Warning: Could not parse image size"
          else
            echo "Frontend image size: ${NUM_SIZE} (parsed)"
          fi

      - name: Start frontend container
        timeout-minutes: 5
        run: |
          docker run -d \
            --name test-frontend \
            -p 8080:4173 \
            -e NODE_ENV=production \
            -e PORT=4173 \
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          echo "Frontend container started"

      - name: Wait for frontend SSR server
        timeout-minutes: 10
        run: |
          echo "Waiting for frontend SSR server..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Frontend SSR server is ready"
              exit 0
            fi
            if [ $i -eq 30 ]; then
              echo "Frontend SSR server failed to start after 30 attempts" >&2
              docker logs test-frontend
              exit 1
            fi
            sleep 2
          done

      - name: Verify frontend health endpoint
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8080/health)
          echo "Health endpoint response: $RESPONSE"
          if echo "$RESPONSE" | grep -qi "ok\|status"; then
            echo "✅ Frontend health endpoint working"
          else
            echo "❌ Frontend health endpoint returned unexpected response"
            exit 1
          fi

      - name: Verify frontend serves SSR HTML
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8080/ | head -20)
          if echo "$RESPONSE" | grep -qi "<!doctype html\|<html"; then
            echo "✅ Frontend serves SSR HTML"
            # Verify SSR content is present
            if echo "$RESPONSE" | grep -qi "<div id=\"root\">"; then
              echo "✅ SSR content detected in HTML"
            else
              echo "⚠️ SSR content may not be present"
            fi
          else
            echo "❌ Frontend does not serve HTML"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Pull backoffice image
        timeout-minutes: 5
        run: docker pull ${{ env.BACKOFFICE_IMAGE }}:sha-${{ github.sha }}

      - name: Start backoffice container
        timeout-minutes: 5
        run: |
          docker network create fitvibe-verification
          docker network connect --alias backend fitvibe-verification test-backend
          docker run -d             --name test-backoffice             --network fitvibe-verification             -p 8081:8080             ${{ env.BACKOFFICE_IMAGE }}:sha-${{ github.sha }}

      - name: Verify backoffice production image
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/__backoffice_health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs test-backoffice
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/login | grep -qi '<!doctype html\|<html'
          curl -fsS http://127.0.0.1:8081/health | grep -qi 'status\|ok'

      - name: Cleanup containers
        if: always()
        timeout-minutes: 2
        run: |
          docker stop test-backend test-frontend test-backoffice 2>/dev/null || true
          docker rm test-backend test-frontend test-backoffice 2>/dev/null || true
          docker network rm fitvibe-verification 2>/dev/null || true

      - name: Job summary
        if: always()
        run: |
          echo "## Build Verification Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Backend container starts and health check passes" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Frontend container starts and serves HTML" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Backoffice container starts, serves the SPA, and proxies backend health" >> $GITHUB_STEP_SUMMARY
            echo "- ℹ️ Image sizes reported for observability; no size budget is enforced in this job" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build verification failed" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Containers may not be functioning correctly" >> $GITHUB_STEP_SUMMARY
          fi
