      - name: Upload QA summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-summary-${{ github.run_id }}
          path: tests/qa/summary
          retention-days: 90
          if-no-files-found: error

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
    permissions:
      contents: read
    # Pin the browser runtime and OS dependencies to the same Playwright version
    # as @playwright/test. Do not provision browsers/apt packages at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build frontend bundle
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend run build

      - name: Run axe accessibility suite
        timeout-minutes: 10
        run: >-
          pnpm exec playwright test
          tests/frontend/e2e/accessibility.spec.cjs
          --config tests/frontend/e2e/playwright.config.cjs
          --workers=1

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-a11y-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  visual_regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - frontend_tests
    permissions:
      contents: read
    # Same Playwright Linux image used by `pnpm test:visual:linux` so font
    # rasterization matches the committed *-linux.png baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build frontend
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Start preview server
        timeout-minutes: 10
        working-directory: apps/frontend
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "Missing dist/client/index.html after build:visual" >&2
            ls -la dist dist/client 2>/dev/null || true
            exit 1
          fi
          # `pnpm --filter … exec` keeps the workspace root as cwd, so Vite would
          # preview an empty repo-root dist/client (HTTP 404) while still printing Local.
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client &
          echo $! > "${GITHUB_WORKSPACE}/preview-server.pid"
          python3 - <<'PY'
          import http.client
          import sys
          import time

          last = "no attempt"
          for _ in range(60):
              try:
                  conn = http.client.HTTPConnection("127.0.0.1", 4173, timeout=2)
                  conn.request("GET", "/")
                  response = conn.getresponse()
                  status = response.status
                  response.read()
                  conn.close()
                  if 200 <= status < 400:
                      print(f"Preview server started (HTTP {status})")
                      sys.exit(0)
                  last = f"HTTP {status}"
              except Exception as exc:
                  last = str(exc)
              time.sleep(2)
          print(f"Preview server did not start in time ({last})", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run visual regression tests
        timeout-minutes: 20
        env:
          APP_URL: "http://127.0.0.1:4173"
          CI: "true"
          DISABLE_WEBSERVER: "true"
        # CI is comparison-only: committed baselines are never rewritten.
        run: pnpm test:visual:ci

      - name: Verify visual baselines were not modified
        if: always()
        run: |
          baseline_changes="$(git status --porcelain --untracked-files=all -- tests/frontend/visual | grep -- '-snapshots/' || true)"
          if [ -n "$baseline_changes" ]; then
            echo "::error::Visual regression CI modified or created baseline snapshots."
            echo "$baseline_changes"
            echo "Baseline updates must be performed explicitly with: pnpm test:visual:update"
            exit 1
          fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) 2>/dev/null || true
            rm -f preview-server.pid
          fi

      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            # Playwright stores actual/expected/diff screenshots and traces here.
            tests/frontend/visual/__screenshots__
            playwright-report/visual
            test-results/visual-junit.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Visual Regression Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Visual regression tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ All screenshots match baseline (maxDiffPixelRatio ≤ 0.2%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Visual regression tests failed" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Visual differences detected - review screenshots" >> $GITHUB_STEP_SUMMARY
          fi

  e2e_smoke:
    name: E2E Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend_tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps

      - name: Build frontend
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend exec pnpm run build

      - name: Run Playwright smoke tests
        timeout-minutes: 10
        run: pnpm exec playwright test tests/frontend/e2e/smoke.spec.cjs --config tests/frontend/e2e/playwright.config.cjs --reporter=line

      - name: Upload Playwright smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps

      - name: Build frontend
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend exec pnpm run build

      - name: Run Playwright e2e tests
        timeout-minutes: 15
        run: pnpm exec playwright test tests/frontend/e2e/smoke.spec.cjs tests/frontend/e2e/active-surfaces.spec.cjs --config tests/frontend/e2e/playwright.config.cjs --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore

  # Native amd64/arm64 builds. QEMU emulation of `pnpm fetch` on GitHub's
  # x86_64 runners routinely exceeds the image-build timeout.
  build-platform:
    name: Build images (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs:
      - quality
      - backend_tests
      - frontend_tests
      - database_tests
      - coverage
      - integration
      - metrics_contract
      - accessibility
      - qa_summary
      - performance
      - security
      - openapi_spec
      - lighthouse
      - i18n
      - contract_tests
      - visual_regression
      - deployment_contract
      - release_governance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          platform_pair="${{ matrix.platform }}"
          platform_pair="${platform_pair//\//-}"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform_pair}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image by digest
        id: backend
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.BACKEND_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=backend-${{ env.PLATFORM_PAIR }}

      - name: Build and push frontend image by digest
        id: frontend
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infra/docker/prod/Dockerfile.frontend
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          tags: ${{ env.FRONTEND_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=frontend-${{ env.PLATFORM_PAIR }}

      - name: Export digests
        run: |
          mkdir -p "${RUNNER_TEMP}/backend-digests" "${RUNNER_TEMP}/frontend-digests"
          backend_digest="${{ steps.backend.outputs.digest }}"
          frontend_digest="${{ steps.frontend.outputs.digest }}"
          touch "${RUNNER_TEMP}/backend-digests/${backend_digest#sha256:}"
          touch "${RUNNER_TEMP}/frontend-digests/${frontend_digest#sha256:}"

      - name: Upload backend digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/backend-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload frontend digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/frontend-digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"

      - name: Determine package versions
        id: versions
        timeout-minutes: 2
        run: |
          if [ ! -f apps/backend/package.json ] || [ ! -f apps/frontend/package.json ]; then
            echo "Error: package.json files not found" >&2
            exit 1
          fi
          backend=$(node -p "require('./apps/backend/package.json').version")
          frontend=$(node -p "require('./apps/frontend/package.json').version")
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"

      - name: Determine release eligibility
        id: release_guard
        timeout-minutes: 2
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Semantic version tags are only published from main."
            exit 0
          fi

          tag="v${{ steps.versions.outputs.backend }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release tag ${tag} already exists; keeping it immutable."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${tag} does not exist; this build may publish it."
          fi

      - name: Download backend digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/backend-digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Download frontend digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/frontend-digests
          pattern: frontend-digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        id: manifests
        timeout-minutes: 5
        run: |
          set -euo pipefail

          backend_count=$(find "${RUNNER_TEMP}/backend-digests" -type f | wc -l)
          frontend_count=$(find "${RUNNER_TEMP}/frontend-digests" -type f | wc -l)
          if [ "${backend_count}" -lt 2 ] || [ "${frontend_count}" -lt 2 ]; then
            echo "Expected 2 platform digests per image (amd64 + arm64)." >&2
            echo "backend=${backend_count} frontend=${frontend_count}" >&2
            exit 1
          fi

          backend_refs=""
          for digest_file in "${RUNNER_TEMP}/backend-digests"/*; do
            backend_refs="${backend_refs} ${BACKEND_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          frontend_refs=""
          for digest_file in "${RUNNER_TEMP}/frontend-digests"/*; do
            frontend_refs="${frontend_refs} ${FRONTEND_IMAGE}@sha256:$(basename "${digest_file}")"
          done

          backend_tags=(-t "${BACKEND_IMAGE}:sha-${GITHUB_SHA}")
          frontend_tags=(-t "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}")

          if [ "${{ steps.release_guard.outputs.should_release }}" = "true" ]; then
            backend_tags+=(-t "${BACKEND_IMAGE}:v${{ steps.versions.outputs.backend }}")
            frontend_tags+=(-t "${FRONTEND_IMAGE}:v${{ steps.versions.outputs.frontend }}")
          fi

          docker buildx imagetools create \
            "${backend_tags[@]}" \
            ${backend_refs}

          docker buildx imagetools create \
            "${frontend_tags[@]}" \
            ${frontend_refs}

          backend_digest=$(docker buildx imagetools inspect "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')
          frontend_digest=$(docker buildx imagetools inspect "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" | awk '/^Digest:/ && !digest {digest=$2} END {print digest}')

          if [ -z "${backend_digest}" ] || [ -z "${frontend_digest}" ]; then
            echo "Failed to resolve merged image digests" >&2
            exit 1
          fi

          echo "backend_digest=${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${frontend_digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign backend image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}

      - name: Sign frontend image
        timeout-minutes: 5
        run: cosign sign --yes ${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}

      - name: Generate backend SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}
          output-file: sbom-backend.spdx.json

      - name: Generate frontend SBOM
        timeout-minutes: 5
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}
          output-file: sbom-frontend.spdx.json

      - name: Record image digests
        timeout-minutes: 2
        run: |
          printf "backend=%s@%s\nfrontend=%s@%s\nstack_version=v%s\n" \
            "${{ env.BACKEND_IMAGE }}" "${{ steps.manifests.outputs.backend_digest }}" \
            "${{ env.FRONTEND_IMAGE }}" "${{ steps.manifests.outputs.frontend_digest }}" \
            "${{ steps.versions.outputs.backend }}" > image-digests.txt

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openapi-${{ github.run_id }}
          path: artifacts/openapi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-artifacts-${{ github.run_id }}
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
            image-digests.txt
            artifacts/openapi/openapi.json
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' && steps.release_guard.outputs.should_release == 'true'
        id: create_release
        timeout-minutes: 5
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ steps.versions.outputs.backend }}
          commit: ${{ github.sha }}
          name: Release v${{ steps.versions.outputs.backend }}
          body: |
            - Backend image: ${{ env.BACKEND_IMAGE }}:v${{ steps.versions.outputs.backend }}
            - Frontend image: ${{ env.FRONTEND_IMAGE }}:v${{ steps.versions.outputs.frontend }}
          draft: false
          prerelease: false
          artifacts: "sbom-backend.spdx.json,sbom-frontend.spdx.json,image-digests.txt,artifacts/openapi/openapi.json"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend image: \`${{ env.BACKEND_IMAGE }}@${{ steps.manifests.outputs.backend_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend image: \`${{ env.FRONTEND_IMAGE }}@${{ steps.manifests.outputs.frontend_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Images signed with cosign" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOMs generated" >> $GITHUB_STEP_SUMMARY

  build_verification:
    name: Build Verification (Container Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        env:
          FRESHCLAM_CHECKS: 0
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitvibe_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate smoke-test JWT key pair
        run: |
          mkdir -p "$RUNNER_TEMP/fitvibe-jwt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048             -out "$RUNNER_TEMP/fitvibe-jwt/private.pem"
          openssl pkey -in "$RUNNER_TEMP/fitvibe-jwt/private.pem" -pubout             -out "$RUNNER_TEMP/fitvibe-jwt/public.pem"
          chmod 644 "$RUNNER_TEMP/fitvibe-jwt/private.pem"
          chmod 644 "$RUNNER_TEMP/fitvibe-jwt/public.pem"

      - name: Set lowercase GHCR image names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=${owner}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/fitvibe-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/fitvibe-frontend" >> "$GITHUB_ENV"

      - name: Install postgresql-client
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        timeout-minutes: 5
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        timeout-minutes: 5
        run: docker pull ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: Verify backend image size
        timeout-minutes: 2
        run: |
          BACKEND_TAG="${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}"
          SIZE=$(docker images "$BACKEND_TAG" --format "{{.Size}}" | head -1)
          echo "Backend image size: $SIZE"
          # Extract numeric size (e.g., "1.2GB" -> 1.2)
          NUM_SIZE=$(echo "$SIZE" | sed 's/[^0-9.]//g' | head -c 4)
          if [ -z "$NUM_SIZE" ] || [ "$NUM_SIZE" = "0" ]; then
            echo "Warning: Could not parse image size"
          else
            echo "Backend image size: ${NUM_SIZE} (parsed)"
          fi

      - name: Start backend container
        timeout-minutes: 5
        run: |
          docker run -d \
            --name test-backend \
            --add-host=host.docker.internal:host-gateway \
            -p 4100:4100 \
            -v "$RUNNER_TEMP/fitvibe-jwt/private.pem:/run/secrets/jwt-private.pem:ro" \
            -v "$RUNNER_TEMP/fitvibe-jwt/public.pem:/run/secrets/jwt-public.pem:ro" \
            -e DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/fitvibe_test" \
            -e NODE_ENV=production \
            -e PORT=4100 \
            -e JWT_PRIVATE_KEY_PATH=/run/secrets/jwt-private.pem \
            -e JWT_PUBLIC_KEY_PATH=/run/secrets/jwt-public.pem \
            -e CLAMAV_ENABLED=true \
            -e CLAMAV_HOST=host.docker.internal \
            -e CLAMAV_PORT=3310 \
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          echo "Backend container started"

      - name: Wait for backend health check
        timeout-minutes: 30
        run: |
          echo "Waiting for backend health endpoint..."
          for i in {1..60}; do
            if curl -f http://127.0.0.1:4100/health >/dev/null 2>&1; then
              echo "Backend health check passed"
              exit 0
            fi
            if [ $i -eq 60 ]; then
              echo "Backend health check failed after 60 attempts" >&2
              docker logs test-backend
              exit 1
            fi
            sleep 2
          done

      - name: Verify backend health endpoint
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:4100/health)
          echo "Health endpoint response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "ok\|healthy\|status"; then
            echo "✅ Backend health endpoint working"
          else
            echo "❌ Backend health endpoint returned unexpected response"
            exit 1
          fi

      - name: Pull frontend image
        timeout-minutes: 5
        run: docker pull ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

      - name: Verify frontend image size
        timeout-minutes: 2
        run: |
          FRONTEND_TAG="${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}"
          SIZE=$(docker images "$FRONTEND_TAG" --format "{{.Size}}" | head -1)
          echo "Frontend image size: $SIZE"
          NUM_SIZE=$(echo "$SIZE" | sed 's/[^0-9.]//g' | head -c 4)
          if [ -z "$NUM_SIZE" ] || [ "$NUM_SIZE" = "0" ]; then
            echo "Warning: Could not parse image size"
          else
            echo "Frontend image size: ${NUM_SIZE} (parsed)"
          fi

      - name: Start frontend container
        timeout-minutes: 5
        run: |
          docker run -d \
            --name test-frontend \
            -p 8080:4173 \
            -e NODE_ENV=production \
            -e PORT=4173 \
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          echo "Frontend container started"

      - name: Wait for frontend SSR server
        timeout-minutes: 10
        run: |
          echo "Waiting for frontend SSR server..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Frontend SSR server is ready"
              exit 0
            fi
            if [ $i -eq 30 ]; then
              echo "Frontend SSR server failed to start after 30 attempts" >&2
              docker logs test-frontend
              exit 1
            fi
            sleep 2
          done

      - name: Verify frontend health endpoint
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8080/health)
          echo "Health endpoint response: $RESPONSE"
          if echo "$RESPONSE" | grep -qi "ok\|status"; then
            echo "✅ Frontend health endpoint working"
          else
            echo "❌ Frontend health endpoint returned unexpected response"
            exit 1
          fi

      - name: Verify frontend serves SSR HTML
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8080/ | head -20)
          if echo "$RESPONSE" | grep -qi "<!doctype html\|<html"; then
            echo "✅ Frontend serves SSR HTML"
            # Verify SSR content is present
            if echo "$RESPONSE" | grep -qi "<div id=\"root\">"; then
              echo "✅ SSR content detected in HTML"
            else
              echo "⚠️ SSR content may not be present"
            fi
          else
            echo "❌ Frontend does not serve HTML"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Cleanup containers
        if: always()
        timeout-minutes: 2
        run: |
          docker stop test-backend test-frontend 2>/dev/null || true
          docker rm test-backend test-frontend 2>/dev/null || true

      - name: Job summary
        if: always()
        run: |
          echo "## Build Verification Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Backend container starts and health check passes" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Frontend container starts and serves HTML" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Image sizes verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build verification failed" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Containers may not be functioning correctly" >> $GITHUB_STEP_SUMMARY
          fi
