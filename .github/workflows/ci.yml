  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 30
    needs:
      - backend_tests
      - frontend_tests
      - database_tests
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        env:
          FRESHCLAM_CHECKS: 0
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      # Individual PG env vars for test files to detect database
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_test
      # Highest priority - test files check this first
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: "127.0.0.1"
      CLAMAV_PORT: "3310"
      REAL_CLAMD: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client \
            postgresql-client

      - name: Wait for services
        timeout-minutes: 15
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start" >&2
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for ClamAV..."
          python3 - <<'PY'
          import socket, time, sys
          host = "127.0.0.1"
          port = 3310
          for i in range(30):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("ClamAV is ready")
                      sys.exit(0)
              except OSError:
                  if i == 29:
                      print("ClamAV failed to start", file=sys.stderr)
                      sys.exit(1)
                  time.sleep(2)
          PY

          echo "Waiting for Redis..."
          python3 - <<'PY'
          import socket, time, sys
          host = "127.0.0.1"
          port = 6379
          for i in range(30):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("Redis is ready")
                      sys.exit(0)
              except OSError:
                  if i == 29:
                      print("Redis failed to start", file=sys.stderr)
                      sys.exit(1)
                  time.sleep(1)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Run database migrations
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/backend exec tsx src/db/utils/migrateAll.ts

      - name: Run scripts.test.ts
        timeout-minutes: 10
        env:
          CI: "true"
        run: pnpm --filter @fitvibe/backend exec jest tests/backend/db/utils/scripts.test.ts --maxWorkers=1

      - name: Run integration tests
        timeout-minutes: 20
        env:
          NODE_ENV: test
          CI: "true"
          REDIS_INTEGRATION: "1"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"
        # maxWorkers=1: these suites truncate a shared Postgres DB and IP-keyed
        # brute-force counters collide when two workers run in parallel.
        run: mkdir -p apps/backend/coverage && pnpm --filter @fitvibe/backend exec jest --maxWorkers=1 --testMatch="**/integration/**/*.integration.test.ts" --testPathIgnorePatterns="/node_modules/" --json --outputFile=coverage/jest-integration.json

      - name: Fail on unexpected skipped tests
        if: always()
        run: node tests/qa/assert-no-unexpected-skips.cjs apps/backend/coverage/jest-integration.json

      - name: Job summary
        if: always()
        run: |
          echo "## Integration Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Scripts test passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Integration tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Integration tests failed" >> $GITHUB_STEP_SUMMARY
          fi

