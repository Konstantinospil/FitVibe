  security:
    name: Security Scans
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 35
    needs:
      - quality
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Dependency audit
        id: dependency_audit
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm audit --prod --audit-level=high

      - name: Scan for CVEs (OSV)
        id: osv
        continue-on-error: true
        timeout-minutes: 10
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=json
            --output=osv-report.json

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-report-${{ github.run_id }}
          path: osv-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Snyk scan
        id: snyk
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd
        with:
          command: test
          args: --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: TruffleHog OSS scan
        id: trufflehog
        continue-on-error: true
        timeout-minutes: 5
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: "./"
          version: "3.97.5"
          extra_args: "--results=verified --fail-on-scan-errors"

      - name: Static secret scan
        id: static_secrets
        continue-on-error: true
        timeout-minutes: 5
        run: node tests/security/secret-scan.cjs

      - name: Filesystem vulnerability scan
        id: trivy
        continue-on-error: true
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          skip-dirs: |
            infra/keys
            infra/docker/keys
            node_modules

      - name: Aggregate required security outcomes
        if: always()
        env:
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          OSV: ${{ steps.osv.outcome }}
          TRUFFLEHOG: ${{ steps.trufflehog.outcome }}
          STATIC_SECRETS: ${{ steps.static_secrets.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          SNYK: ${{ steps.snyk.outcome }}
        run: |
          {
            echo "## Security Scan Summary"
            echo "- pnpm audit: $DEPENDENCY_AUDIT"
            echo "- OSV: $OSV"
            echo "- TruffleHog: $TRUFFLEHOG"
            echo "- Static secret scan: $STATIC_SECRETS"
            echo "- Trivy: $TRIVY"
            echo "- Snyk (advisory external service): ${SNYK:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for outcome in "$DEPENDENCY_AUDIT" "$OSV" "$TRUFFLEHOG" "$STATIC_SECRETS" "$TRIVY"; do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required deterministic security controls failed."
            exit 1
          fi

          if [ -n "${SNYK:-}" ] && [ "$SNYK" != "success" ] && [ "$SNYK" != "skipped" ]; then
            echo "::warning::Snyk failed or was unavailable. Required repository-native security controls still passed."
          fi

