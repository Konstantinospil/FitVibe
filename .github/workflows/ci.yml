name: CI

# Concurrency control: cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "dev", "feature"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Default permissions (can be overridden per job for least privilege)
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  actions: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24"
  # Disable all caching
  TURBO_TOKEN: ""
  TURBO_REMOTE_CACHE: "false"
  PNPM_STORE_DIR: "/tmp/pnpm-store"

# Full verification runs before promotion on feature, and is repeated on dev/main.
# Release governance and image publishing remain main-only.

jobs:
  architecture_hardcoding:
    name: Architecture & Hardcoding
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend constants and policy authority
        id: architecture_backend
        continue-on-error: true
        run: node tests/qa/check-architecture-hardcoding.mjs backend

      - name: Frontend design-token compliance
        id: architecture_frontend_tokens
        continue-on-error: true
        run: node tests/qa/check-architecture-hardcoding.mjs frontend-tokens

      - name: Frontend component reuse
        id: architecture_frontend_reuse
        continue-on-error: true
        run: node tests/qa/check-architecture-hardcoding.mjs frontend-reuse

      - name: Enforce zero-tolerance result
        if: always()
        env:
          BACKEND_OUTCOME: ${{ steps.architecture_backend.outcome }}
          FRONTEND_TOKENS_OUTCOME: ${{ steps.architecture_frontend_tokens.outcome }}
          FRONTEND_REUSE_OUTCOME: ${{ steps.architecture_frontend_reuse.outcome }}
        run: |
          failed=0
          if [ "$BACKEND_OUTCOME" != "success" ]; then
            echo "::error::Backend policy-authority diagnostic failed."
            failed=1
          fi
          if [ "$FRONTEND_TOKENS_OUTCOME" != "success" ]; then
            echo "::error::Frontend design-token diagnostic failed."
            failed=1
          fi
          if [ "$FRONTEND_REUSE_OUTCOME" != "success" ]; then
            echo "::error::Frontend component-reuse diagnostic failed."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Architecture & Hardcoding gate passed with zero violations."

      - name: Job summary
        if: always()
        env:
          BACKEND_OUTCOME: ${{ steps.architecture_backend.outcome }}
          FRONTEND_TOKENS_OUTCOME: ${{ steps.architecture_frontend_tokens.outcome }}
          FRONTEND_REUSE_OUTCOME: ${{ steps.architecture_frontend_reuse.outcome }}
        run: |
          echo "## Architecture & Hardcoding" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend policy authority: $BACKEND_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend design tokens: $FRONTEND_TOKENS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend component reuse: $FRONTEND_REUSE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality Gates (Lint & Type Check)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Full history for better caching and blame

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate package manifests
        run: node tests/qa/check-package-json.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Verify dependency integrity
        run: |
          pnpm audit --prod --audit-level=moderate
          echo "Dependency integrity check completed"

      - name: Lint
        timeout-minutes: 10
        run: pnpm lint:check

      - name: Ban silent test returns
        timeout-minutes: 2
        run: pnpm test:no-silent-returns
      - name: Enforce test lifecycle ownership
        timeout-minutes: 2
        run: pnpm test:lifecycle

      - name: Enforce test discovery ownership
        timeout-minutes: 2
        run: node tests/qa/assert-test-discovery.cjs

      - name: Type check
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Job summary
        if: always()
        run: |
          echo "## Quality Gates Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Quality job passed (manifest validation, dependency audit, lint, silent-return guard, lifecycle guard, test-discovery ownership, typecheck)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ Quality job failed. See the first failing step above; no individual check is reported as passed unless the job reached success." >> "$GITHUB_STEP_SUMMARY"
          fi

  deployment_contract:
    name: Deployment Contract
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate canonical production Compose contract
        run: bash scripts/validate-production-compose.sh

  release_governance:
    name: Release Governance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require merged-PR provenance for main release commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const mergedToMain = response.data.filter(
              (pr) => pr.merged_at && pr.base?.ref === 'main',
            );
            if (mergedToMain.length === 0) {
              core.setFailed(
                'main release commits must originate from a merged pull request; direct-push releases are blocked',
              );
            }

      - name: Document non-release branch policy
        if: github.ref != 'refs/heads/main'
        run: echo "feature/dev are working branches; release provenance enforcement applies to main."

  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        env:
          FRESHCLAM_CHECKS: 0
        options: >-
          --health-cmd="clamdscan --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      # Individual PG env vars for test files to detect database
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_test
      # Highest priority - test files check this first
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: "127.0.0.1"
      CLAMAV_PORT: "3310"
      REAL_CLAMD: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Wait for services
        timeout-minutes: 15
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start" >&2
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for ClamAV..."
          python3 - <<'PY'
          import socket, time, sys
          host = "127.0.0.1"
          port = 3310
          for i in range(30):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("ClamAV is ready")
                      sys.exit(0)
              except OSError:
                  if i == 29:
                      print("ClamAV failed to start", file=sys.stderr)
                      sys.exit(1)
                  time.sleep(2)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Backend unit tests & coverage
        timeout-minutes: 15
        run: pnpm --filter @fitvibe/backend exec jest --coverage --maxWorkers=2 --testPathIgnorePatterns="migrations/migrations\\.test\\.ts|seeds/seeds\\.test\\.ts|.*\\.integration\\.test\\.ts$" --json --outputFile=coverage/jest-unit.json

      - name: Fail on unexpected skipped tests
        if: always()
        run: node tests/qa/assert-no-unexpected-skips.cjs apps/backend/coverage/jest-unit.json

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-${{ github.run_id }}
          path: apps/backend/coverage
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          echo "## Backend Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Backend unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Backend unit tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  frontend_tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CI: "true"
      VITEST_MAX_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Frontend unit tests & coverage
        timeout-minutes: 10
        run: pnpm --filter @fitvibe/frontend test -- --coverage --maxWorkers=2 --reporter=default --reporter=json --outputFile=coverage/vitest-unit.json

      - name: Fail on unexpected skipped tests
        if: always()
        run: node tests/qa/assert-no-unexpected-skips.cjs apps/frontend/coverage/vitest-unit.json

      - name: Verify frontend coverage output
        if: always()
        run: |
          echo "Frontend coverage directory:"
          ls -la apps/frontend/coverage || true
          if [ ! -f apps/frontend/coverage/coverage-summary.json ] && [ ! -f apps/frontend/coverage/coverage-final.json ]; then
            echo "::error::Frontend coverage reports were not written to apps/frontend/coverage"
            find apps/frontend -name 'coverage-summary.json' -o -name 'coverage-final.json' -o -name 'lcov.info' | head -20
            exit 1
          fi

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: apps/frontend/coverage
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Frontend unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Frontend unit tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  backoffice_tests:
    name: Backoffice E2E
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 25
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Run backoffice authorization smoke tests
        timeout-minutes: 10
        run: pnpm test:backoffice

      - name: Upload backoffice Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backoffice-playwright-${{ github.run_id }}
          path: |
            playwright-report/backoffice
            test-results/backoffice
          retention-days: 30
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Backoffice E2E Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Backoffice privilege-wall smoke tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ Backoffice privilege-wall smoke tests failed." >> "$GITHUB_STEP_SUMMARY"
          fi

  database_tests:
    name: Database Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fitvibe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      # Individual PG env vars for test files to detect database
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fitvibe_test
      # Highest priority - test files check this first
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/fitvibe_test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client \
            postgresql-client

      - name: Wait for PostgreSQL
        timeout-minutes: 10
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              echo "✓ Database is automatically provided by GitHub Actions service container"
              echo "  Connection: postgresql://postgres@127.0.0.1:5432/fitvibe_test"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Run database migration tests
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend exec jest migrations/migrations.test.ts --maxWorkers=1

      - name: Run database seed tests
        timeout-minutes: 10
        run: |
          pnpm --filter @fitvibe/backend exec jest seeds/seeds.test.ts --maxWorkers=1

      - name: Force close database connections
        if: always()
        timeout-minutes: 2
        run: |
          echo "Closing all database connections..."
          psql -h 127.0.0.1 -p 5432 -U postgres -d fitvibe_test -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'fitvibe_test' AND pid <> pg_backend_pid();" || true
          echo "Database connections closed"

      - name: Job summary
        if: always()
        run: |
          echo "## Database Tests Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Migration tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Seed tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Database tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 15
    needs:
      - backend_tests
      - frontend_tests
    permissions:
      contents: read
      actions: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Download backend coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage-${{ github.run_id }}
          path: apps/backend/coverage

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: apps/frontend/coverage

      - name: Aggregate coverage files
        timeout-minutes: 5
        run: |
          mkdir -p coverage
          find apps packages -name "lcov.info" -exec cat {} \; > coverage/lcov.info || true
          if [ ! -s coverage/lcov.info ]; then
            echo "No coverage files found" > coverage/lcov.info
          fi

      - name: Enforce coverage gate
        timeout-minutes: 10
        run: pnpm test:coverage:gate

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
          retention-days: 30
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: success() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unit
          name: codecov-umbrella

      - name: Job summary
        if: always()
        run: |
          echo "## Coverage Gate Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Coverage gate passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Coverage gate failed" >> $GITHUB_STEP_SUMMARY
          fi

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main'))
    timeout-minutes: 20
    needs:
      - quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build frontend (SSR)
        run: pnpm --filter @fitvibe/frontend run build:ssr

      - name: Start SSR server
        timeout-minutes: 10
        env:
          NODE_ENV: production
          PORT: 4173
        run: |
          cd apps/frontend
          pnpm start:ssr &
          echo $! > ../ssr-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null 2>&1; then
              echo "SSR server started"
              exit 0
            fi
            sleep 2
          done
          echo "SSR server did not start in time" >&2
          exit 1

      - name: Run Lighthouse CI
        timeout-minutes: 10
        env:
          LHCI_PORT: "4173"
        # Login-only CI audit. Performance floor is 0.6 because React hydration TBT
        # dominates the category under simulated mobile; LCP/JS/a11y stay strict.
        run: pnpm exec lhci autorun --config=tests/perf/lighthouserc.ci.json --exit-on-error

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: tests/perf/lhci-output
          retention-days: 30
          if-no-files-found: error

      - name: Stop SSR server
        if: always()
        timeout-minutes: 1
        run: |
          pkill -f "tsx server.ts" || pkill -f "start:ssr" || true
          if [ -f apps/frontend/ssr-server.pid ]; then
            kill "$(cat apps/frontend/ssr-server.pid)" 2>/dev/null || true
            rm -f apps/frontend/ssr-server.pid
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## Lighthouse Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ Lighthouse CI passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Lighthouse CI failed" >> $GITHUB_STEP_SUMMARY
          fi

