  zap_baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - quality
      - frontend_tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build production SSR frontend
        run: pnpm --filter @fitvibe/frontend run build:ssr

      - name: Scan compiled client for secrets
        run: node tests/security/secret-scan.cjs apps/frontend/dist/client

      - name: Start production SSR frontend
        run: |
          NODE_ENV=production PORT=4173 pnpm --filter @fitvibe/frontend run start:ssr > /tmp/fitvibe-zap-ssr.log 2>&1 &
          echo $! > /tmp/fitvibe-zap-ssr.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then
              echo "Production SSR frontend ready for ZAP"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitvibe-zap-ssr.log || true
          echo "Production SSR frontend did not become ready for ZAP" >&2
          exit 1

      - name: Verify SSR security headers
        run: |
          headers="$(curl -fsSI http://127.0.0.1:4173/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp'
          printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          if printf '%s\n' "$headers" | grep -qi '^x-powered-by:'; then
            echo "::error::SSR leaks X-Powered-By"
            exit 1
          fi
          csp="$(printf '%s\n' "$headers" | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy:[[:space:]]*//p')"
          printf '%s\n' "$csp" | grep -q "script-src 'self'"
          if printf '%s\n' "$csp" | grep -Eq "script-src[^;]*'unsafe-inline'"; then
            echo "::error::SSR CSP permits inline scripts"
            exit 1
          fi
          if printf '%s\n' "$csp" | grep -Eq "style-src[^-][^;]*'unsafe-inline'"; then
            echo "::error::SSR CSP broadly permits inline style blocks"
            exit 1
          fi

      - name: Run ZAP baseline scan
        timeout-minutes: 12
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:4173
          rules_file_name: .zap/rules.tsv
          cmd_options: -c .zap/rules.tsv -j --client-spider
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ github.run_id }}

      - name: Stop frontend
        if: always()
        run: |
          if [ -f /tmp/fitvibe-zap-ssr.pid ]; then
            kill "$(cat /tmp/fitvibe-zap-ssr.pid)" 2>/dev/null || true
          fi

  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - lighthouse
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install native canvas prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Build frontend
        run: pnpm --filter @fitvibe/frontend run build

      - name: Start mock services
        timeout-minutes: 10
        run: |
          node tests/perf/mock-server.mjs &
          echo $! > mock-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then
              echo "Mock server started"
              exit 0
            fi
            sleep 3
          done
          echo "Mock server did not start in time" >&2
          exit 1

      - name: Run k6 smoke test
        timeout-minutes: 10
        env:
          API_BASE_URL: http://127.0.0.1:4173/health
        run: k6 run --summary-export=tests/perf/k6-summary.json tests/perf/k6-smoke.js

      - name: Assert k6 performance budgets
        timeout-minutes: 10
        run: node tests/perf/assert-budgets.cjs tests/perf/k6-summary.json

      - name: Stop mock server
        if: always()
        timeout-minutes: 1
        run: |
          pkill -f "mock-server.mjs" || true
          if [ -f mock-server.pid ]; then
            kill "$(cat mock-server.pid)" 2>/dev/null || true
            rm -f mock-server.pid
          fi
          sleep 1

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-metrics-${{ github.run_id }}
          path: |
            tests/perf/k6-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          echo "## Performance Budgets Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- ✅ k6 performance tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Performance tests failed" >> $GITHUB_STEP_SUMMARY
          fi

