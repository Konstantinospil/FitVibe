name: Update Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baseline-update
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Regenerate Linux baselines
        run: pnpm test:visual:update

      - name: Verify regenerated baselines
        run: pnpm test:visual

      - name: Stage and validate generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add -A
          mapfile -t changed < <(git diff --cached --name-only)

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No visual baseline changes were generated."
            exit 0
          fi

          invalid=0
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ ^tests/frontend/visual/.+-linux\.png$ ]]; then
              echo "Unexpected generated change: $path" >&2
              invalid=1
            fi
          done

          if [ "$invalid" -ne 0 ]; then
            echo "Refusing to commit changes outside Linux visual baseline PNGs." >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          printf 'Generated baseline changes:\n'
          printf '  %s\n' "${changed[@]}"

      - name: Commit baseline update
        if: steps.changes.outputs.has_changes == 'true'
        id: commit
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          branch="chore/visual-baselines-${RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): update Linux baselines"
          git push --set-upstream origin "$branch"

      - name: Open draft pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/pr-body.md <<'EOF'
          ## Purpose

          Regenerates the committed Playwright Linux visual-regression baselines from the current `dev` branch using the repository's pinned baseline-generation path.

          ## Review gate

          - Review every changed `*-linux.png` file as an intentional UI change.
          - Do not merge if a screenshot exposes an unintended regression.
          - When the screenshots are approved, mark this PR **Ready for review**.
          - The normal CI pipeline then runs against the approved baselines.

          Generated by the manually triggered **Update Visual Baselines** workflow.
          EOF

          gh pr create \
            --base dev \
            --head "$HEAD_BRANCH" \
            --draft \
            --title "test(visual): update Linux baselines" \
            --body-file /tmp/pr-body.md

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual baseline update"
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "A draft PR containing only regenerated Linux baseline PNGs was created."
              echo "Review the screenshots, then mark the PR Ready for review to trigger normal CI."
            else
              echo "No baseline changes were generated; no PR was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
