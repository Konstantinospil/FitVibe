name: Refresh reviewed visual baselines

on:
  push:
    branches:
      - feat/341-frontend-restructure
    paths:
      - .github/workflows/update-visual-baselines.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build frontend
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Start preview server
        working-directory: apps/frontend
        run: |
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client &
          echo $! > "${GITHUB_WORKSPACE}/preview-server.pid"
          python3 - <<'PY'
          import http.client
          import sys
          import time
          for _ in range(60):
              try:
                  conn = http.client.HTTPConnection("127.0.0.1", 4173, timeout=2)
                  conn.request("GET", "/")
                  response = conn.getresponse()
                  response.read()
                  conn.close()
                  if 200 <= response.status < 400:
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          sys.exit(1)
          PY

      - name: Update reviewed Linux baselines
        env:
          APP_URL: http://127.0.0.1:4173
          CI: "true"
          DISABLE_WEBSERVER: "true"
        run: pnpm exec playwright test --config tests/frontend/visual/config/playwright.config.ts --update-snapshots=changed

      - name: Commit Linux baselines
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)tests/frontend/visual/**/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then
            echo "No Linux baseline changes."
            exit 0
          fi
          git commit -m "test(visual): refresh reviewed Linux baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) 2>/dev/null || true
          fi
