name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or ref whose UI should be used to regenerate baselines"
        required: true
        default: "dev"
        type: string
      target_branch:
        description: "Branch the baseline PR should target"
        required: true
        default: "dev"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-visual-baselines:
    name: Regenerate Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.source_ref }}" in
            refs/*)
              echo "source_ref must be a branch, tag, or SHA without the refs/ prefix" >&2
              exit 1
              ;;
          esac
          case "${{ inputs.target_branch }}" in
            dev|stage|main) ;;
            *)
              echo "target_branch must be one of: dev, stage, main" >&2
              exit 1
              ;;
          esac

      - name: Checkout source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Regenerate approved-environment baselines
        run: pnpm test:visual:update

      - name: Verify generated baselines
        run: pnpm test:visual

      - name: Restrict changes to visual baselines
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No visual baseline changes were produced."
            exit 0
          fi

          unexpected="$(
            git status --porcelain               | awk '{print $2}'               | grep -vE '^tests/frontend/visual/.+\.spec\.ts-snapshots/.+-linux\.png$'               || true
          )"

          if [ -n "$unexpected" ]; then
            echo "The baseline update modified files outside committed Linux snapshot paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Updated baselines:"
          git status --short

      - name: Create baseline branch
        if: steps.changes.outputs.has_changes == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/visual-baselines-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"

      - name: Commit baseline screenshots
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/frontend/visual/**/*-linux.png'
          git diff --cached --quiet && {
            echo "No baseline PNG changes staged."
            exit 0
          }
          git commit -m "test(visual): update Linux baselines"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open draft baseline PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ inputs.target_branch }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          ## Visual baseline update

          Generated from source ref: `$SOURCE_REF`

          The workflow regenerated Linux Playwright baselines using the repository's pinned visual-test environment and verified them with `pnpm test:visual`.

          ### Review gate

          - Review the changed `*-linux.png` baseline images.
          - Confirm the visual changes are intentional.
          - Do not merge this PR merely because the updater completed successfully.
          - When the new baselines are approved, mark this draft PR **Ready for review**.
          - The normal CI workflow will then run against the approved baseline PR.

          Only committed Linux visual baseline PNGs are allowed in this PR.
          EOF

          gh pr create             --base "$BASE_BRANCH"             --head "$HEAD_BRANCH"             --title "test(visual): update Linux baselines"             --body-file /tmp/pr-body.md             --draft

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual Baseline Update"
            echo
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "- Linux baselines regenerated and verified."
              echo "- A dedicated branch was pushed."
              echo "- A draft pull request was opened for human review."
              echo "- Mark the PR Ready for review only after approving the screenshot changes."
            else
              echo "- No baseline changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
