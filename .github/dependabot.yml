# Dependabot version updates for the FitVibe pnpm monorepo.
# Security updates still target `main` (GitHub default). Version PRs target `feature`.
# This file must live on the default branch (`main`) before GitHub will honor it.
version: 2

updates:
  # Single npm entry at the workspace root. Do not add apps/* or packages/* —
  # a second npm directory breaks pnpm workspaces (shared pnpm-lock.yaml).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "feature"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    ignore:
      # Vendored via pnpm overrides (link:packages/patched-*) for CVEs.
      - dependency-name: "glob"
      - dependency-name: "extract-zip"
    groups:
      production-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Dockerfiles (Dockerfile.*) plus Kubernetes manifests that pin image tags.
  - package-ecosystem: "docker"
    directories:
      - "/infra/docker/dev"
      - "/infra/docker/prod"
      - "/infra/nginx"
      - "/infra/kubernetes"
    target-branch: "feature"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "ghcr.io/konstantinospil/fitvibe-backend"
      - dependency-name: "ghcr.io/konstantinospil/fitvibe-frontend"
    groups:
      docker-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directories:
      - "/infra/docker/dev"
      - "/infra/docker/prod"
      - "/infra/docker/staging"
      - "/infra/docker/test"
    target-branch: "feature"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "ghcr.io/konstantinospil/fitvibe-backend"
      - dependency-name: "ghcr.io/konstantinospil/fitvibe-frontend"
    groups:
      compose-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
